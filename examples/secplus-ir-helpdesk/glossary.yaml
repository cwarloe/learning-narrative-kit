bank_id: secplus-sy0-701-ir
title: Security+ SY0-701 — incident response (help-desk precursor)
source: CompTIA Security+ SY0-701 objectives (incident response process; detection and analysis; containment,
  eradication, and recovery; post-incident activities)
terms:
- id: event
  title: Event
  definition: An observable occurrence in a system or network — a login, alert, crash, or odd ticket —
    that may or may not be a security problem.
  refs:
  - CompTIA Security+ SY0-701 — events vs incidents
  tags:
  - ir
  tier: exam
- id: security_incident
  title: Security incident
  definition: A violation or imminent threat of violation of security policy, acceptable use, or standard
    security practices — not every scary ticket qualifies.
  refs:
  - CompTIA Security+ SY0-701 — security incidents
  tags:
  - ir
  tier: exam
- id: escalation
  title: Escalation
  definition: Handing an issue to a higher or more specialized team when criteria are met — with clean
    facts, not a Slack panic dump.
  refs:
  - CompTIA Security+ SY0-701 — escalation
  tags:
  - ir
  tier: exam
- id: first_responder
  title: First responder
  definition: First person or team to touch an incident — at many orgs the help desk is that first touch
    and must preserve options for IR.
  refs:
  - CompTIA Security+ SY0-701 — first responders
  tags:
  - ir
  tier: exam
- id: csirt
  title: CSIRT / IR team
  definition: Computer Security Incident Response Team (or equivalent IR team) — specialists who own analysis,
    forensics coordination, and incident command after escalation.
  refs:
  - CompTIA Security+ SY0-701 — CSIRT / incident response team
  tags:
  - ir
  tier: exam
- id: chain_of_custody
  title: Chain of custody
  definition: Documented control of evidence — who had it, when, and what changed — so findings stay credible
    and you do not casually wipe a laptop IR still needs.
  refs:
  - CompTIA Security+ SY0-701 — chain of custody
  tags:
  - ir
  - evidence
  tier: exam
- id: ioc
  title: Indicator of compromise (IoC)
  definition: Observable clue that compromise may have happened — odd domains, hashes, filenames, login
    patterns — that desk can document and escalate.
  refs:
  - CompTIA Security+ SY0-701 — indicators of compromise
  tags:
  - ir
  - detection
  tier: exam
- id: quarantine
  title: Quarantine
  definition: Isolating a file, email, or host into a restricted state so it cannot harm others while
    it is inspected or held.
  refs:
  - CompTIA Security+ SY0-701 — quarantine
  tags:
  - ir
  - containment
  tier: exam
- id: isolation
  title: Isolation
  definition: Separating a system from the network or peers to stop spread — pull the cable, disable Wi-Fi,
    or VLAN-park the host.
  refs:
  - CompTIA Security+ SY0-701 — isolation
  tags:
  - ir
  - containment
  tier: exam
- id: need_to_know
  title: Need-to-know
  definition: Principle of sharing incident details only with people who require them to act — not blasting
    the whole company Slack.
  refs:
  - CompTIA Security+ SY0-701 — need-to-know / least privilege of information
  tags:
  - ir
  tier: exam
- id: ticket
  title: Ticket
  definition: Tracked support request — the work unit the desk opens, updates, and closes; not automatically
    an incident.
  tags:
  - support
  - desk
  tier: support
