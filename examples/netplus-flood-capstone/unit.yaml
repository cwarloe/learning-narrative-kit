unit_id: netplus-flood-capstone
title: "Portland Desk — The Portland Flood"
audience: "Someone studying CompTIA Network+ N10-008/009 disaster recovery, Layer 1 cabling, VLAN trunking, DHCP storm mitigation, and Layer 2 loop prevention, or following Ethan's help-desk journey in Book 0"
purpose: "Test Layer 1 through Layer 4 network restoration under disaster recovery conditions, covering flooded closet recovery, switch replacements, 802.1Q trunking, DHCP scope exhaustion storms, and Spanning Tree verification during a midnight municipal emergency."
estimated_minutes: 45
sources:
  - CompTIA Network+ N10-008 Domain 1.2, 1.4, 2.1, 4.1, 4.2
  - CompTIA Network+ N10-009 Domain 1.2, 1.4, 2.1, 4.1, 4.2
glossary: glossary.yaml
narrative: narrative.md
workbench: workbench.md
mark_convention: "[[term_id|surface text]]"
glossary_tiers:
  exam: "Network+ study targets — primary examination concepts"
  support: "Desk/network jargon marked for operational context"
tooltip_contract:
  body: [definition, context]
  exclude_from_hover: [refs, sources, related]
  definition_style: "short 1–2 sentences; exam-faithful for tier exam"
  context_style: "optional one clause when bare definition needs operational grounding"
constraints:
  - Every glossary term appears at least once in narrative marks
  - Story must pass the cover test (readable with marks hidden)
  - Grounded workplace realism; zero synthetic AI tells
  - First person past tense narration; strictly no forbidden names
  - Target 16-20 word sentence mean with full clauses and zero staccato
