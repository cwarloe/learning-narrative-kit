  tier: exam
- id: argument
  prompt: "argument"
  answer: "In Excel and Access, and in Word tables, information necessary for a formula or function to calculate an answer."
  tags:
  - mod-13
  tier: exam
- id: arithmetic_operators
  prompt: "arithmetic operators"
  answer: "In a formula, a symbol that performs mathematical calculations, such as addition (+), subtraction (-), multiplication (*), division (/), or exponentiation (^)."
  tags:
  - mod-13
  tier: exam
