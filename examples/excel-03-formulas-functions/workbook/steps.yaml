# Recording script for Excel 3 ("The Crew Bonus").
#
# One source, two renderings (build_workbook.py writes both):
#   RECORDING.md        for a person:  `do` + `expect`
#   AGENT_RECORDING.md  for a computer-use agent: the `bot` actions
#
# Bot actions (one per line):
#   tab NAME            click the sheet tab NAME
#   goto REF            Ctrl+G, type REF, Enter  (selects a cell or range)
#   enter TEXT          type TEXT exactly, then press Enter
#   type TEXT           type TEXT exactly, no Enter
#   key KEYS            press a key or chord (Enter, Esc, Ctrl+D, Ctrl+F, Ctrl+A)
#   fill RANGE          goto RANGE, then Ctrl+D (copies the top row down)
#   see REF TEXT        look: REF should display TEXT (not checked at build time)
#   check REF VALUE     look: REF should display VALUE; build_workbook.py verifies
#                       VALUE against the recalculated answer key, so it can't be wrong
#   pause N             wait N seconds without touching anything
#   note TEXT           look: something on screen that isn't a cell (a dialog, a message)
#
# {TC_LAST} is replaced with the last data row of the Timeclock sheet.
# Every clip's `passage` must appear in narrative.md (the build fails otherwise).
unit: excel-03-formulas-functions
workbook: crew-bonus-start.xlsx
clips:
  - id: 1
    title: "Hours that cross midnight"
    passage: "The first thing he needed was hours."
    steps:
      - do: "Click the Timeclock sheet tab. Click cell G2."
        bot: ["tab Timeclock", "goto G2"]
      - do: "Type =(D2-C2)*24 and press Enter."
        expect: "G2 shows -12.50. The night shift crossed midnight, so clock-out is smaller than clock-in."
        bot: ["enter =(D2-C2)*24", "pause 2", "see G2 -12.50"]
      - do: "Click G2 again. Type =IF(D2<C2,D2+1-C2,D2-C2)*24 and press Enter."
        expect: "G2 shows 11.50."
        bot: ["goto G2", "enter =IF(D2<C2,D2+1-C2,D2-C2)*24", "pause 2", "check Timeclock!G2 11.50"]
      - do: "Click H2. Type =MAX(0,G2-8) and press Enter."
        expect: "H2 shows 3.50, the overtime past eight hours."
        bot: ["goto H2", "enter =MAX(0,G2-8)", "pause 1", "check Timeclock!H2 3.50"]
      - do: "Select G2:H2 and double-click the fill handle (the small square at the lower right of the selection)."
        expect: "Both columns fill to the bottom of the export."
        bot: ["fill G2:H{TC_LAST}", "pause 2", "goto G2"]
  - id: 2
    title: "Who qualified"
    passage: "Ruth's eligibility rule had two parts"
    steps:
      - do: "Click the Bonus sheet tab. Click F2. Type =COUNTIF(Timeclock!A:A,A2) and press Enter."
        expect: "61, the days employee 1101 worked."
        bot: ["tab Bonus", "goto F2", "enter =COUNTIF(Timeclock!A:A,A2)", "pause 1", "check Bonus!F2 61"]
      - do: "In G2, type =COUNTIF(Safety!B:B,A2) and press Enter."
        expect: "G2 shows 0 incidents."
        bot: ["goto G2", "enter =COUNTIF(Safety!B:B,A2)", "pause 1", "check Bonus!G2 0"]
      - do: "In I2, type =AND(F2>=60,G2=0) and press Enter."
        expect: "TRUE."
        bot: ["goto I2", "enter =AND(F2>=60,G2=0)", "pause 2", "see I2 TRUE"]
      - do: "Click I2. Type =OR(AND(F2>=60,G2=0),H2=Leave) and press Enter. (The quotation marks are left out on purpose.)"
        expect: "#NAME? appears."
        bot: ["goto I2", "enter =OR(AND(F2>=60,G2=0),H2=Leave)", "pause 2", "see I2 #NAME?"]
      - do: "Click I2. Type =OR(AND(F2>=60,G2=0),H2=\"Light duty\",H2=\"Leave\") and press Enter."
        expect: "TRUE. Column H is still empty; it fills in during clip 5."
        bot: ["goto I2", "enter =OR(AND(F2>=60,G2=0),H2=\"Light duty\",H2=\"Leave\")", "pause 2", "check Bonus!I2 TRUE"]
  - id: 3
    title: "What normal looks like"
    passage: "Eli started with the AVERAGE function"
    steps:
      - do: "Click the Checks sheet tab. In B2, type =AVERAGE(WMS!D:D) and press Enter."
        expect: "41.3"
        bot: ["tab Checks", "goto B2", "enter =AVERAGE(WMS!D:D)", "pause 2", "check Checks!B2 41.3"]
      - do: "In B3, type =MEDIAN(WMS!D:D) and press Enter."
        expect: "44"
        bot: ["goto B3", "enter =MEDIAN(WMS!D:D)", "pause 2", "check Checks!B3 44"]
      - do: "In B4, type =MODE.MULT(WMS!D:D) and press Enter."
        expect: "45"
        bot: ["goto B4", "enter =MODE.MULT(WMS!D:D)", "pause 2", "check Checks!B4 45"]
  - id: 4
    title: "Totals by crew and month"
    passage: "Two nights later Hank called down from head office."
    steps:
      - do: "In B6, type =SUMIF(Timeclock!E:E,\"Night\",Timeclock!H:H) and press Enter."
        expect: "3016.5, total night-crew overtime for the quarter."
        bot: ["goto B6", "enter =SUMIF(Timeclock!E:E,\"Night\",Timeclock!H:H)", "pause 1", "check Checks!B6 3016.5"]
      - do: "In B7, type =COUNTIF(Timeclock!G:G,\">10\") and press Enter."
        expect: "616 shifts over ten hours."
        bot: ["goto B7", "enter =COUNTIF(Timeclock!G:G,\">10\")", "pause 1", "check Checks!B7 616"]
      - do: "In B8, type =AVERAGEIF(Timeclock!E:E,\"Night\",Timeclock!G:G) and press Enter."
        expect: "9.02, the average night shift."
        bot: ["goto B8", "enter =AVERAGEIF(Timeclock!E:E,\"Night\",Timeclock!G:G)", "pause 1", "check Checks!B8 9.02"]
      - do: "In B9, type =SUMIFS(Timeclock!H:H,Timeclock!E:E,\"Night\",Timeclock!F:F,\"Sep\") and press Enter."
        expect: "1103.0, night overtime in September. Note the order: in SUMIFS the range to add comes first."
        bot: ["goto B9", "enter =SUMIFS(Timeclock!H:H,Timeclock!E:E,\"Night\",Timeclock!F:F,\"Sep\")", "pause 2", "check Checks!B9 1103.0"]
      - do: "In B10, type =COUNTIFS(Timeclock!E:E,\"Night\",Timeclock!F:F,\"Sep\",Timeclock!G:G,\">10\") and press Enter."
        expect: "220"
        bot: ["goto B10", "enter =COUNTIFS(Timeclock!E:E,\"Night\",Timeclock!F:F,\"Sep\",Timeclock!G:G,\">10\")", "pause 1", "check Checks!B10 220"]
      - do: "In B11, type =AVERAGEIFS(Timeclock!G:G,Timeclock!E:E,\"Night\",Timeclock!F:F,\"Sep\") and press Enter."
        expect: "9.47"
        bot: ["goto B11", "enter =AVERAGEIFS(Timeclock!G:G,Timeclock!E:E,\"Night\",Timeclock!F:F,\"Sep\")", "pause 1", "check Checks!B11 9.47"]
      - do: "In B12, type =MAXIFS(Timeclock!G:G,Timeclock!E:E,\"Night\",Timeclock!F:F,\"Sep\") and press Enter."
        expect: "11.50, the longest night shift in September."
        bot: ["goto B12", "enter =MAXIFS(Timeclock!G:G,Timeclock!E:E,\"Night\",Timeclock!F:F,\"Sep\")", "pause 1", "check Checks!B12 11.50"]
      - do: "In B13, type =MINIFS(Timeclock!G:G,Timeclock!E:E,\"Night\",Timeclock!F:F,\"Aug\") and press Enter."
        expect: "3.00, the week the forklift was down."
        bot: ["goto B13", "enter =MINIFS(Timeclock!G:G,Timeclock!E:E,\"Night\",Timeclock!F:F,\"Aug\")", "pause 2", "check Checks!B13 3.00"]
  - id: 5
    title: "The lookups"
    passage: "Each employee's tier came from their pallets per hour"
    steps:
      - do: "Click the Bonus sheet tab. In B2, type =VLOOKUP(A2,HR!$A:$F,2,FALSE) and press Enter."
        expect: "Dale Ostrander"
        bot: ["tab Bonus", "goto B2", "enter =VLOOKUP(A2,HR!$A:$F,2,FALSE)", "pause 1", "check Bonus!B2 Dale Ostrander"]
      - do: "In C2, type =VLOOKUP(A2,HR!$A:$F,4,FALSE) and press Enter."
        expect: "$330.15"
        bot: ["goto C2", "enter =VLOOKUP(A2,HR!$A:$F,4,FALSE)", "pause 1", "check Bonus!C2 330.15"]
      - do: "In H2, type =VLOOKUP(A2,HR!$A:$F,6,FALSE)&\"\" and press Enter."
        expect: "Blank. Dale has no special status. (The &\"\" turns an empty cell into blank text instead of 0.)"
        bot: ["goto H2", "enter =VLOOKUP(A2,HR!$A:$F,6,FALSE)&\"\"", "pause 1", "see H2 (blank)"]
      - do: "In D2, type =ROUND(AVERAGEIF(WMS!A:A,A2,WMS!D:D),0) and press Enter."
        expect: "44"
        bot: ["goto D2", "enter =ROUND(AVERAGEIF(WMS!A:A,A2,WMS!D:D),0)", "pause 1", "check Bonus!D2 44"]
      - do: "In J2, type =VLOOKUP(D2,Tiers!$A$2:$C$5,2,TRUE) and press Enter."
        expect: "2. An approximate match: 44 is at least the 44 cutoff and under 52."
        bot: ["goto J2", "enter =VLOOKUP(D2,Tiers!$A$2:$C$5,2,TRUE)", "pause 2", "check Bonus!J2 2"]
      - do: "In E2, type =IFS(J2=3,\"Gold\",J2=2,\"Silver\",J2=1,\"Bronze\",J2=0,\"Base\") and press Enter."
        expect: "Silver"
        bot: ["goto E2", "enter =IFS(J2=3,\"Gold\",J2=2,\"Silver\",J2=1,\"Bronze\",J2=0,\"Base\")", "pause 2", "check Bonus!E2 Silver"]
  - id: 6
    title: "Rounding"
    passage: "The bonus came out in odd amounts"
    steps:
      - do: "In K2, type =C2*VLOOKUP(D2,Tiers!$A$2:$C$5,3,TRUE) and press Enter."
        expect: "$412.6875"
        bot: ["goto K2", "enter =C2*VLOOKUP(D2,Tiers!$A$2:$C$5,3,TRUE)", "pause 2", "check Bonus!K2 412.6875"]
      - do: "Click the Checks sheet tab. In B15, type =ROUND(Bonus!K2,2) and press Enter."
        expect: "$412.69"
        bot: ["tab Checks", "goto B15", "enter =ROUND(Bonus!K2,2)", "pause 1", "check Checks!B15 412.69"]
      - do: "In B16, type =ROUNDDOWN(Bonus!K2,0) and press Enter."
        expect: "$412.00"
        bot: ["goto B16", "enter =ROUNDDOWN(Bonus!K2,0)", "pause 1", "check Checks!B16 412.00"]
      - do: "In B18, type =ROUNDDOWN(-1.9,0). In B19, type =INT(-1.9)."
        expect: "-1 and -2. ROUNDDOWN moves toward zero; INT goes to the next lowest integer."
        bot: ["goto B18", "enter =ROUNDDOWN(-1.9,0)", "goto B19", "enter =INT(-1.9)", "pause 2", "check Checks!B18 -1", "check Checks!B19 -2"]
      - do: "In B17, type =MROUND(Bonus!K2,5) and press Enter."
        expect: "$415.00"
        bot: ["goto B17", "enter =MROUND(Bonus!K2,5)", "pause 2", "check Checks!B17 415.00"]
      - do: "Click the Bonus sheet tab. In L2, type =MROUND(K2,5). In N2, type =INT(F2/5)."
        expect: "L2 shows $415. N2 shows 12 full weeks."
        bot: ["tab Bonus", "goto L2", "enter =MROUND(K2,5)", "goto N2", "enter =INT(F2/5)", "pause 1", "check Bonus!L2 415", "check Bonus!N2 12"]
  - id: 7
    title: "Dates"
    passage: "The payout date came from Ruth's rule"
    steps:
      - do: "Click the Checks sheet tab. In B22, type =WORKDAY(B21,10) and press Enter."
        expect: "10/14/2026"
        bot: ["tab Checks", "goto B22", "enter =WORKDAY(B21,10)", "pause 2", "check Checks!B22 10/14/2026"]
      - do: "In B23, type =NETWORKDAYS(HR!E7,B21). In B24, type =NETWORKDAYS(HR!E27,B21). In B25, type =NETWORKDAYS(HR!E28,B21)."
        expect: "53, 63 and 43: the most days each new hire could have worked. Only Kyle Banks could reach 60."
        bot: ["goto B23", "enter =NETWORKDAYS(HR!E7,B21)", "enter =NETWORKDAYS(HR!E27,B21)", "enter =NETWORKDAYS(HR!E28,B21)", "pause 2",
              "check Checks!B23 53", "check Checks!B24 63", "check Checks!B25 43"]
      - do: "In B26, type =TODAY() and press Enter."
        expect: "Today's date. It will change every time the file is opened, which is the problem."
        bot: ["goto B26", "enter =TODAY()", "pause 2", "see B26 today's date"]
      - do: "Click B26 and type 10/6/2026, then press Enter. In C26, type: Typed, not TODAY()."
        bot: ["goto B26", "enter 10/6/2026", "goto C26", "enter Typed, not TODAY()", "pause 1", "check Checks!B26 10/06/2026"]
      - do: "In B27, type =CELL(\"filename\",A1) and press Enter."
        expect: "The file's full path and the sheet name."
        bot: ["goto B27", "enter =CELL(\"filename\",A1)", "pause 2", "see B27 the file's path, ending in [crew-bonus-…]Checks"]
  - id: 8
    title: "One formula for the total"
    passage: "The last number Hank wanted was the total payout"
    steps:
      - do: "Click the Bonus sheet tab. In M2, type =IF(I2,1,0) and press Enter."
        expect: "1"
        bot: ["tab Bonus", "goto M2", "enter =IF(I2,1,0)", "pause 1", "check Bonus!M2 1"]
      - do: "Select B2:N2 and double-click the fill handle."
        expect: "Every row fills. Row 6 (employee 1147) shows #N/A in several columns."
        bot: ["fill B2:N38", "pause 2", "goto B6", "pause 2", "see B6 #N/A"]
      - do: "Click L40. Type =SUM(L2:L38*M2:M38) and press Enter. (In Excel 2019 or earlier, press Ctrl+Shift+Enter.)"
        expect: "#N/A. One bad row breaks the total."
        bot: ["goto L40", "enter =SUM(L2:L38*M2:M38)", "pause 3", "see L40 #N/A"]
  - id: 9
    title: "The IFERROR that hid a person"
    passage: "Eli's first try at the total"
    steps:
      - do: "Click B2. Change the formula to =IFERROR(VLOOKUP(A2,HR!$A:$F,2,FALSE),0) and press Enter."
        bot: ["goto B2", "enter =IFERROR(VLOOKUP(A2,HR!$A:$F,2,FALSE),0)"]
      - do: "Click C2. Change it to =IFERROR(VLOOKUP(A2,HR!$A:$F,4,FALSE),0). Click H2. Change it to =IFERROR(VLOOKUP(A2,HR!$A:$F,6,FALSE)&\"\",0)."
        bot: ["goto C2", "enter =IFERROR(VLOOKUP(A2,HR!$A:$F,4,FALSE),0)", "goto H2", "enter =IFERROR(VLOOKUP(A2,HR!$A:$F,6,FALSE)&\"\",0)"]
      - do: "Select B2:C2, double-click the fill handle. Select H2, double-click the fill handle."
        expect: "Row 6 now shows 0 instead of #N/A. L40 shows $9,840. The sheet looks clean."
        bot: ["fill B2:C38", "fill H2:H38", "goto L40", "pause 3", "check Bonus!B6 0", "check Bonus!L40 9840"]
  - id: 10
    title: "Marco's pay stub"
    passage: "On payday, a forklift driver named Marco Reyes"
    steps:
      - do: "Click the HR sheet tab. Press Ctrl+F, search for 1147, and press Find Next."
        expect: "Excel can't find it."
        bot: ["tab HR", "key Ctrl+F", "type 1147", "key Enter", "pause 2", "note a message says Excel couldn't find what you were looking for", "key Enter"]
      - do: "Search for Marco instead."
        expect: "Marco Reyes, row 6, with Emp ID 1174: two digits swapped."
        bot: ["key Ctrl+A", "type Marco", "key Enter", "pause 2", "key Esc", "see HR!A6 1174"]
      - do: "Close Find. Click A6 on the HR sheet, type 1147, press Enter."
        bot: ["goto A6", "enter 1147"]
      - do: "Click the Bonus sheet tab."
        expect: "Row 6 shows Marco Reyes, $330.15, and a $415 bonus. L40 shows $10,255."
        bot: ["tab Bonus", "goto B6", "pause 2", "see B6 Marco Reyes", "goto L40", "pause 3", "see L40 $10,255"]
      - do: "Click B2. Change it to =IFERROR(VLOOKUP(A2,HR!$A:$F,2,FALSE),\"ID NOT FOUND\") and fill down. Click C2 and remove the IFERROR: =VLOOKUP(A2,HR!$A:$F,4,FALSE), and fill down."
        expect: "A missing ID will now show ID NOT FOUND, and the total will break loudly instead of quietly coming up short."
        bot: ["goto B2", "enter =IFERROR(VLOOKUP(A2,HR!$A:$F,2,FALSE),\"ID NOT FOUND\")", "goto C2", "enter =VLOOKUP(A2,HR!$A:$F,4,FALSE)",
              "fill B2:C38", "goto L40", "pause 3", "see L40 $10,255"]
