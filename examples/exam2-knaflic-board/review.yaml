deck_id: exam2-knaflic-board
cards:
- id: exploratory_analysis
  prompt: Exploratory analysis
  answer: 'Looking through data without a fixed question, to understand it and find out what might be worth telling someone. Knaflic''s picture: opening many oysters to find a few pearls.'
  tags:
  - knaflic-ch1
  tier: exam
- id: explanatory_analysis
  prompt: Explanatory analysis
  answer: Communicating one specific finding you already have to a specific audience; the pearl, not the oysters.
  tags:
  - knaflic-ch1
  tier: exam
- id: audience
  prompt: Audience
  answer: The people you are communicating to. Narrow it as far as you can; the review deck asks whether to present to the widest possible audience or a specific one, and the specific one is the answer.
  tags:
  - knaflic-ch1
  tier: exam
- id: presentation_context
  prompt: Presentation context
  answer: 'What you must settle before building anything: who the audience is, what you need them to know or do, and how the data can help you make the point.'
  tags:
  - knaflic-ch1
  tier: exam
- id: big_idea
  prompt: Big Idea
  answer: A single complete sentence that states your point of view and what is at stake.
  tags:
  - knaflic-ch1
  tier: exam
- id: storyboarding
  prompt: Storyboarding
  answer: Sketching the outline of a presentation, one note per slide, and rearranging it before building anything.
  tags:
  - knaflic-ch1
  tier: exam
- id: communication_method
  prompt: Communication method
  answer: How the message is delivered, such as a live presentation or a document read alone. A live talk can carry less on the slide because the speaker adds the rest; a document must stand on its own.
  tags:
  - knaflic-ch1
  tier: exam
- id: get_data
  prompt: Get data
  answer: The Power BI command that connects to a data source and starts an import.
  tags:
  - power-bi
  tier: support
- id: calculated_measure
  prompt: Calculated measure
  answer: A calculation that belongs to the entire data set, not to a table. Use it for all aggregate functions. Computed on the fly in a visual, it adapts to whatever filters are applied, and it can be used in other calculations.
  tags:
  - power-bi
  - dax
  tier: exam
- id: dax_function
  prompt: DAX function
  answer: A function in a Power BI formula. In Total Sales = SUM(Sales[SalesAmount]), SUM is the DAX function and adds up all of the numbers in the Sales[SalesAmount] column.
  tags:
  - power-bi
  - dax
  tier: exam
- id: argument
  prompt: Argument
  answer: A value or expression placed inside a function's parentheses. A function requires an argument to pass it a value; SUM(Sales[SalesAmount]) has one.
  tags:
  - power-bi
  - dax
  tier: exam
