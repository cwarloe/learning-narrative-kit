deck_id: mis-04-ethics-legal
cards:
- id: acceptable_use_policies
  prompt: "acceptable use policies"
  answer: "An acceptable use policy is a set of rules specifying the legal and ethical use of a system and the consequences of noncompliance."
  tags:
  - mod-04
  tier: exam
- id: accountability
  prompt: "accountability"
  answer: "Accountability refers to issues involving both a user’s and organization’s responsibilities and liabilities."
  tags:
  - mod-04
  tier: exam
- id: business_networking_ethics
  prompt: "Business networking ethics"
  answer: "Business networking ethics advocates that to maintain a business network, not only should the organization provide open and fair access to all authorized users, it should also consider three types of networking: utilitarian, emotional, and virtuous."
  tags:
  - mod-04
  tier: exam
- id: cheap_fakes
  prompt: "Cheap fakes"
  answer: "Cheap fakes, sometimes known as the new fake news, are audiovisual manipulations of events created with cheap software that’s readily available on the Web and then modified using Photoshop and other tools and distributed through the Web."
  tags:
  - mod-04
  tier: exam
- id: cookies
  prompt: "Cookies"
  answer: "Cookies are small text files with unique ID tags that are embedded in a Web browser and saved on the user’s hard drive."
  tags:
  - mod-04
  tier: exam
- id: cybersquatting
  prompt: "cybersquatting"
  answer: "Cybersquatting is registering, selling, or using a domain name to profit from someone else’s trademark."
  tags:
  - mod-04
  tier: exam
- id: deepfakes
  prompt: "Deepfakes"
  answer: "Deepfakes are fake videos or audio recordings that look and sound just like real events."
  tags:
  - mod-04
  tier: exam
- id: digital_citizenship
  prompt: "Digital citizenship"
  answer: "Digital citizenship means using information technology safely, ethically, and responsibly."
  tags:
  - mod-04
  tier: exam
- id: digital_divide
  prompt: "digital divide"
  answer: "Information technology and the Internet have created a digital divide. Computers are still not affordable for many people. The digital divide has implications for education."
  tags:
  - mod-04
  tier: exam
- id: disinformation
  prompt: "disinformation"
  answer: "Disinformation is fake information that is knowingly distributed."
  tags:
  - mod-04
  tier: exam
- id: fake_news
  prompt: "Fake news"
  answer: "Fake news is a story or hoax created to intentionally misinform or deceive readers."
  tags:
  - mod-04
  tier: exam
- id: general_data_protection_regulation_gdpr
  prompt: "General Data Protection Regulation (GDPR)"
  answer: "The General Data Protection Regulation (GDPR) covers a series of laws that protect European Union (EU) citizens’ personal data, including genetic data, health records, racial or ethnic origin, and religious beliefs."
  tags:
  - mod-04
  tier: exam
- id: green_computing
  prompt: "Green computing"
  answer: "Green computing involves the design, manufacture, use, and disposal of computers, servers, and other computing devices so that there is minimal impact on the environment."
  tags:
  - mod-04
  tier: exam
- id: intellectual_property
  prompt: "Intellectual property"
  answer: "Intellectual property is a legal umbrella covering protections that involve copyrights, trademarks, trade secrets, and patents for “creations of the mind” developed by people or businesses."
  tags:
  - mod-04
  tier: exam
- id: log_files
  prompt: "Log files"
  answer: "Log files, which are generated by Web server software, record a user’s actions on a Web site."
  tags:
  - mod-04
  tier: exam
- id: misinformation
  prompt: "Misinformation"
  answer: "Misinformation is fake information that is distributed to an audience, regardless of intent to mislead."
  tags:
  - mod-04
  tier: exam
- id: social_media_networking_ethics
  prompt: "Social media networking ethics"
  answer: "Social media networking ethics advocates that social media should be open and provide fair access to all of its users."
  tags:
  - mod-04
  tier: exam
- id: spam
  prompt: "spam"
  answer: "Spam is an unsolicited e-mail sent for advertising purposes."
  tags:
  - mod-04
  tier: exam
