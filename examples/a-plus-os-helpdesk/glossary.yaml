bank_id: a-plus-core2-os-helpdesk
title: "CompTIA A+ Core 2 — OS Diagnostics, Event Logs, and Boot Recovery"
source: "CompTIA A+ Core 2 (220-1102) Domain 1.0 Operating Systems and Domain 2.0 Security"
terms:
  - id: troubleshooting_methodology
    title: Troubleshooting Methodology
    definition: "The standardized six-step diagnostic framework used to identify, isolate, resolve, and document computing failures."
    context: "On the desk, it is the discipline of binary search: eliminating half the potential failure domains with every test before touching settings."
    refs:
      - "CompTIA A+ Core 2 (220-1102) Objective 1.4"
    tags: [methodology, diagnostic]
    tier: exam
  - id: safe_mode
    title: Safe Mode
    definition: "A diagnostic boot state that loads Windows with a minimal set of essential drivers and system services."
    context: "Used to determine whether a system crash or hang originates in base operating system files or third-party software and drivers."
    refs:
      - "CompTIA A+ Core 2 (220-1102) Objective 1.4"
    tags: [boot, diagnostics]
    tier: exam
  - id: event_viewer
    title: Event Viewer
    definition: "A Microsoft Management Console snap-in that logs system, application, and security messages, errors, and audit events."
    context: "Provides authoritative timestamps and error codes (such as Event IDs 1000 and 41) that distinguish software crashes from kernel power cuts."
    refs:
      - "CompTIA A+ Core 2 (220-1102) Objective 1.4"
    tags: [logging, triage]
    tier: exam
  - id: clean_boot
    title: Clean Boot
    definition: "An operating system startup state achieved by disabling all non-Microsoft background services and startup applications."
    context: "Isolates third-party software conflicts through systematic binary elimination without disabling essential Windows core functions."
    refs:
      - "CompTIA A+ Core 2 (220-1102) Objective 1.4"
    tags: [troubleshooting, services]
    tier: exam
  - id: device_driver
    title: Device Driver
    definition: "A specialized software program that allows the operating system kernel to communicate with and control physical hardware components."
    context: "Corrupted or mismatched graphics drivers running in kernel space can lock the entire desktop when applications invoke hardware acceleration."
    refs:
      - "CompTIA A+ Core 2 (220-1102) Objective 1.1"
    tags: [hardware, kernel]
    tier: exam
  - id: bitlocker_recovery
    title: BitLocker Recovery Key
    definition: "A 48-digit numerical password required to unlock a BitLocker-encrypted volume when platform configuration registers (PCRs) detect hardware or firmware changes."
    context: "Stored in Active Directory or Azure AD and released to users only after out-of-band identity verification to prevent unauthorized data access."
    refs:
      - "CompTIA A+ Core 2 (220-1102) Objective 2.8"
    tags: [security, encryption]
    tier: exam
