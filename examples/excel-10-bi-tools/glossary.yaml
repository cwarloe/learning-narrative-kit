bank_id: excel-10-bi-tools
title: Tamarack — Davenport's First Month — glossary
source: 'MindTap course glossary export (Excel / BI), module ''20. Excel 10: Analyzing Data with Business Intelligence Tools'''
terms:
- id: category_map
  title: "category map"
  definition: "A map chart that fills regions belonging to the same category with the same color."
  tags:
  - mod-20
  tier: exam
- id: data_view
  title: "Data view"
  definition: "In Power Pivot, the view that shows the contents of each table in the Data Model in a separate tab."
  tags:
  - mod-20
  tier: exam
- id: diagram_view
  title: "Diagram view"
  definition: "The view in PowerPivot that shows the structure of each data table."
  tags:
  - mod-20
  tier: exam
- id: key_performance_indicator
  title: "key performance indicator"
  definition: "A measurement used by business to measure achievement of a specific goal."
  tags:
  - mod-20
  tier: exam
- id: linked_data_types
  title: "Linked data types"
  definition: "Data types linked to resources on the Internet."
  tags:
  - mod-20
  tier: exam
- id: one_to_one_relationship
  title: "one-to-one relationship"
  definition: "A relationship between two tables in which each record in the first table matches at most one record in the second table, and each record in the second table matches at most one record in the first table."
  tags:
  - mod-20
  tier: exam
- id: relational_databases
  title: "relational databases"
  definition: "A database that consists of a collection of tables that can be joined through a common field; each table contains information on a specific subject, stored in the same file."
  tags:
  - mod-20
  tier: exam
- id: value_map
  title: "value map"
  definition: "A map chart that fills regions with a color gradient based on the numeric value associated with each region."
  tags:
  - mod-20
  tier: exam
