bank_id: excel-05-multiple-workbooks
title: Tamarack — Eleven Workbooks — glossary
source: 'MindTap course glossary export (Excel / BI), module ''15. Excel 5: Generating Reports from Multiple Worksheets and Workbooks'''
terms:
- id: indirect_referencing
  title: "indirect referencing"
  definition: "A cell reference in which the reference itself is a calculated value."
  tags:
  - mod-15
  tier: exam
- id: path
  title: "path"
  definition: "An address that describes the exact location of a file in a file hierarchy showing the folder with the highest hierarchy level on the left and steps through each hierarchy level toward the right; locations are separated by small triangles or by backslashes."
  tags:
  - mod-15
  tier: exam
- id: template
  title: "template"
  definition: "A file with a theme applied and that may contain formatted placeholder text, headers and footers, and graphics that you replace with your own information for hundreds of purposes, including budgets, flyers, and resumes; template files have slightly different file extensions than standard application files, such as .xltx, .pptx., or .dotx."
  tags:
  - mod-15
  tier: exam
- id: watch_window
  title: "Watch Window"
  definition: "In Excel, a window that displays values of cells located throughout the workbook."
  tags:
  - mod-15
  tier: exam
