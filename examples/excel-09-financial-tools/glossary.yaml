bank_id: excel-09-financial-tools
title: Tamarack — Hank's Year-End — glossary
source: 'MindTap course glossary export (Excel / BI), module ''19. Excel 9: Exploring Financial Tools and Functions'''
terms:
- id: bins
  title: "bins"
  definition: "Categories within a histogram into which data values are allocated."
  tags:
  - mod-19
  tier: exam
- id: cash_flow
  title: "cash flow"
  definition: "The movement of money to and from an individual or company."
  tags:
  - mod-19
  tier: exam
- id: confidence_bounds
  title: "confidence bounds"
  definition: "The upper and lower measures of the uncertainty of a forecast, indicating the range forecasted values will lie within."
  tags:
  - mod-19
  tier: exam
- id: cumipmt_function
  title: "CUMIPMT function"
  definition: "The financial function to calculate the sum of several interest payments."
  tags:
  - mod-19
  tier: exam
- id: cumprinc_function
  title: "CUMPRINC function"
  definition: "The financial function to calculate the cumulative total of payments made toward the principal."
  tags:
  - mod-19
  tier: exam
- id: declining_balance_depreciation
  title: "declining balance depreciation"
  definition: "A depreciation in which an asset loses value by an equal percentage each time period until it reach the salvage value."
  tags:
  - mod-19
  tier: exam
- id: forecast_sheets
  title: "Forecast sheets"
  definition: "An Excel tool used for modeling data and forecasting future values."
  tags:
  - mod-19
  tier: exam
- id: gross_profit
  title: "gross profit"
  definition: "The difference between sales revenue and the cost of goods sold."
  tags:
  - mod-19
  tier: exam
- id: histogram
  title: "histogram"
  definition: "A column chart displaying the distribution of values from a single data series."
  tags:
  - mod-19
  tier: exam
- id: income_statement
  title: "income statement"
  definition: "A financial statement that summarizes the income and expenses incurred during a specified interval. Also called a profit and loss statement."
  tags:
  - mod-19
  tier: exam
- id: profit_and_loss_p_l_statement
  title: "profit and loss (P&L) statement"
  definition: "A financial statement that summarizes the income and expenses incurred during a specified interval. Also called an income statement."
  tags:
  - mod-19
  tier: exam
- id: r_statistic
  title: "R² statistic"
  definition: "A measure of the percentage of the variability in a data series that can be explained by a trendline."
  tags:
  - mod-19
  tier: exam
- id: seasonal_data
  title: "seasonal data"
  definition: "Data in which the data values follow a periodic pattern throughout the calendar year."
  tags:
  - mod-19
  tier: exam
- id: straight_line_depreciation
  title: "straight-line depreciation"
  definition: "A depreciation method in which an asset loses value by an equal amount each time period until it reach the salvage value."
  tags:
  - mod-19
  tier: exam
- id: tangible_assets
  title: "tangible assets"
  definition: "Noncash assets such as equipment, land, buildings, and vehicles."
  tags:
  - mod-19
  tier: exam
- id: time_value_of_money
  title: "time value of money"
  definition: "A financial concept based on the observation that money received today is often worth more than the same amount received later."
  tags:
  - mod-19
  tier: exam
- id: trendline
  title: "trendline"
  definition: "A line that represents the general direction in a series of data."
  tags:
  - mod-19
  tier: exam
- id: xirr_function
  title: "XIRR function"
  definition: "The financial function to calculate the internal rate of return for a series of cash flows made at specified dates."
  tags:
  - mod-19
  tier: exam
- id: xnpv_function
  title: "XNPV function"
  definition: "The financial function to calculate the net present value of a series of cash flows at specified dates."
  tags:
  - mod-19
  tier: exam
