  - mod-19
  tier: exam
- id: profit_and_loss_p_l_statement
  prompt: "profit and loss (P&L) statement"
  answer: "A financial statement that summarizes the income and expenses incurred during a specified interval. Also called an income statement."
  tags:
  - mod-19
  tier: exam
- id: r_statistic
