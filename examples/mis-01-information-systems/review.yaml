deck_id: mis-01-information-systems
cards:
- id: computer_literacy
  prompt: "Computer literacy"
  answer: "Computer literacy is skill in using productivity software, such as word processors, spreadsheets, database management systems, and presentation software, as well as having a basic knowledge of hardware and software, the Internet, and collaboration tools and technologies."
  tags:
  - mod-01
  tier: exam
- id: data
  prompt: "data"
  answer: "Data consists of raw facts and is a component of an information system."
  tags:
  - mod-01
  tier: exam
- id: five_forces_model
  prompt: "Five Forces Model"
  answer: "Michael Porter’s Five Forces Model analyzes an organization, its position in the marketplace, and how information systems could be used to make it more competitive. The five forces include buyer power, supplier power, threat of substitute products or services, threat of new entrants, and rivalry among existing competitors."
  tags:
  - mod-01
  tier: exam
- id: information
  prompt: "Information"
  answer: "Information consists of facts that have been analyzed by the process component and is an output of an information system."
  tags:
  - mod-01
  tier: exam
- id: information_literacy
  prompt: "Information literacy"
  answer: "Information literacy is understanding the role of information in generating and using business intelligence."
  tags:
  - mod-01
  tier: exam
- id: information_technologies
  prompt: "information technologies"
  answer: "Information technologies support information systems and use the Internet, computer networks, database systems, POS systems, and RFID tags."
  tags:
  - mod-01
  tier: exam
- id: management_information_system_mis
  prompt: "management information system (MIS)"
  answer: "A management information system (MIS) is an organized integration of hardware and software technologies, data, processes, and human elements designed to produce timely, integrated, relevant, accurate, and useful information for decision-making purposes."
  tags:
  - mod-01
  tier: exam
- id: process
  prompt: "process"
  answer: "The process component of an information system generates the most useful type of information for decision making, including transaction-processing reports and models for decision analysis."
  tags:
  - mod-01
  tier: exam
- id: strategic_information_systems_siss
  prompt: "Strategic information systems (SISs)"
  answer: "Strategic information systems (SISs) focus on big-picture, long-term goals and objectives and assist an organization or a decision maker to achieve them."
  tags:
  - mod-01
  tier: exam
- id: transaction_processing_systems_tpss
  prompt: "transaction-processing systems (TPSs)"
  answer: "Transaction-processing systems (TPSs) focus on data collection and processing; the major reason for using them is cost reduction."
  tags:
  - mod-01
  tier: exam
- id: virtual_organizations
  prompt: "virtual organizations"
  answer: "Virtual organizations are networks of independent companies, suppliers, customers, and manufacturers connected via information technology so they can share skills and costs and have access to each other’s markets."
  tags:
  - mod-01
  tier: exam
