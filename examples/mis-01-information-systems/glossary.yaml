bank_id: mis-01-information-systems
title: Tamarack — The Count That Didn't Match — glossary
source: MindTap course glossary export (MIS), module '01. Information Systems in Business'
terms:
- id: computer_literacy
  title: "Computer literacy"
  definition: "Computer literacy is skill in using productivity software, such as word processors, spreadsheets, database management systems, and presentation software, as well as having a basic knowledge of hardware and software, the Internet, and collaboration tools and technologies."
  tags:
  - mod-01
  tier: exam
- id: data
  title: "data"
  definition: "Data consists of raw facts and is a component of an information system."
  tags:
  - mod-01
  tier: exam
- id: five_forces_model
  title: "Five Forces Model"
  definition: "Michael Porter’s Five Forces Model analyzes an organization, its position in the marketplace, and how information systems could be used to make it more competitive. The five forces include buyer power, supplier power, threat of substitute products or services, threat of new entrants, and rivalry among existing competitors."
  tags:
  - mod-01
  tier: exam
- id: information
  title: "Information"
  definition: "Information consists of facts that have been analyzed by the process component and is an output of an information system."
  tags:
  - mod-01
  tier: exam
- id: information_literacy
  title: "Information literacy"
  definition: "Information literacy is understanding the role of information in generating and using business intelligence."
  tags:
  - mod-01
  tier: exam
- id: information_technologies
  title: "information technologies"
  definition: "Information technologies support information systems and use the Internet, computer networks, database systems, POS systems, and RFID tags."
  tags:
  - mod-01
  tier: exam
- id: management_information_system_mis
  title: "management information system (MIS)"
  definition: "A management information system (MIS) is an organized integration of hardware and software technologies, data, processes, and human elements designed to produce timely, integrated, relevant, accurate, and useful information for decision-making purposes."
  tags:
  - mod-01
  tier: exam
- id: process
  title: "process"
  definition: "The process component of an information system generates the most useful type of information for decision making, including transaction-processing reports and models for decision analysis."
  tags:
  - mod-01
  tier: exam
- id: strategic_information_systems_siss
  title: "Strategic information systems (SISs)"
  definition: "Strategic information systems (SISs) focus on big-picture, long-term goals and objectives and assist an organization or a decision maker to achieve them."
  tags:
  - mod-01
  tier: exam
- id: transaction_processing_systems_tpss
  title: "transaction-processing systems (TPSs)"
  definition: "Transaction-processing systems (TPSs) focus on data collection and processing; the major reason for using them is cost reduction."
  tags:
  - mod-01
  tier: exam
- id: virtual_organizations
  title: "virtual organizations"
  definition: "Virtual organizations are networks of independent companies, suppliers, customers, and manufacturers connected via information technology so they can share skills and costs and have access to each other’s markets."
  tags:
  - mod-01
  tier: exam
