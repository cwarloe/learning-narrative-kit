deck_id: mis-02-computers
cards:
- id: application_software
  prompt: "application software"
  answer: "Application software can be commercial software or software developed in-house; it is used to perform a variety of tasks on a personal computer."
  tags:
  - mod-02
  tier: exam
- id: arithmetic_logic_unit_alu
  prompt: "arithmetic logic unit (ALU)"
  answer: "The arithmetic logic unit (ALU) performs arithmetic operations (+, −, *, /) as well as comparison or relational operations (<, >, =); the latter are used to compare numbers."
  tags:
  - mod-02
  tier: exam
- id: assembly_language
  prompt: "Assembly language"
  answer: "Assembly language, the second generation of computer languages, is a higher-level language than machine language but is also machine dependent. It uses a series of short codes, or mnemonics, to represent data or instructions."
  tags:
  - mod-02
  tier: exam
- id: bus
  prompt: "bus"
  answer: "A bus is a link between devices connected to the computer. It can be parallel or serial, internal (local) or external."
  tags:
  - mod-02
  tier: exam
- id: cache_ram
  prompt: "cache RAM"
  answer: "Cache RAM resides on the processor. Because memory access from main RAM storage takes several clock cycles (a few nanoseconds), cache RAM stores recently accessed memory so the processor is not waiting for the memory transfer."
  tags:
  - mod-02
  tier: exam
- id: central_processing_unit_cpu
  prompt: "central processing unit (CPU)"
  answer: "The central processing unit (CPU) is the heart of a computer. It is divided into two components: the arithmetic logic unit (ALU) and the control unit."
  tags:
  - mod-02
  tier: exam
- id: computer
  prompt: "computer"
  answer: "A computer is a machine that accepts data as input, processes data without human intervention by using stored instructions, and outputs information."
  tags:
  - mod-02
  tier: exam
- id: control_unit
  prompt: "control unit"
  answer: "The control unit tells the computer what to do, such as instructing the computer which device to read or send output to."
  tags:
  - mod-02
  tier: exam
- id: cpu_case
  prompt: "CPU case"
  answer: "A CPU case is also known as a computer chassis or tower. It is the enclosure containing the computer’s main components."
  tags:
  - mod-02
  tier: exam
- id: disk_drive
  prompt: "disk drive"
  answer: "A disk drive is a peripheral device for recording, storing, and retrieving information."
  tags:
  - mod-02
  tier: exam
- id: fifth_generation_languages_5gls
  prompt: "Fifth-generation languages (5GLs)"
  answer: "Fifth-generation languages (5GLs) use some artificial intelligence technologies, such as knowledge-based systems, natural language processing (NLP), visual programming, and a graphical approach to programming. These languages are designed to facilitate natural conversations between you and the computer."
  tags:
  - mod-02
  tier: exam
- id: fourth_generation_languages_4gls
  prompt: "Fourth-generation languages (4GLs)"
  answer: "Fourth-generation languages (4GLs) use macro codes that can take the place of several lines of programming. The commands are powerful and easy to learn, even for people with little computer training."
  tags:
  - mod-02
  tier: exam
- id: high_level_languages
  prompt: "high-level languages"
  answer: "High-level languages are machine independent and part of the third generation of computer languages. Many languages are available, and each is designed for a specific purpose."
  tags:
  - mod-02
  tier: exam
- id: input_devices
  prompt: "Input devices"
  answer: "Input devices send data and information to the computer. Examples include a keyboard and mouse."
  tags:
  - mod-02
  tier: exam
- id: machine_language
  prompt: "machine language"
  answer: "Machine language, the first generation of computer languages, consists of a series of 0s and 1s representing data or instructions. It is dependent on the machine, so code written for one type of computer does not work on another type of computer."
  tags:
  - mod-02
  tier: exam
- id: magnetic_disk
  prompt: "magnetic disk"
  answer: "A magnetic disk, made of Mylar or metal, is used for random-access processing. In other words, data can be accessed in any order, regardless of its order on the surface."
  tags:
  - mod-02
  tier: exam
- id: magnetic_tape
  prompt: "Magnetic tape"
  answer: "Magnetic tape is made of a plastic material and stores data sequentially."
  tags:
  - mod-02
  tier: exam
- id: main_memory
  prompt: "Main memory"
  answer: "Main memory stores data and information and is usually volatile; its contents are lost when electrical power is turned off. It plays a major role in a computer’s performance."
  tags:
  - mod-02
  tier: exam
- id: motherboard
  prompt: "motherboard"
  answer: "A motherboard is the main circuit board containing connectors for attaching additional boards. It usually contains the CPU, basic input/output system (BIOS), memory, storage, interfaces, serial and parallel ports, expansion slots, and all the controllers for standard peripheral devices, such as the display monitor, disk drive, and keyboard."
  tags:
  - mod-02
  tier: exam
- id: network_attached_storage_nas
  prompt: "Network-attached storage (NAS)"
  answer: "Network-attached storage (NAS) is essentially a network-connected computer dedicated to providing file-based data storage services to other network devices."
  tags:
  - mod-02
  tier: exam
- id: object_oriented_programming_oop
  prompt: "object-oriented programming (OOP)"
  answer: "An object-oriented programming (OOP) language is organized around a system of objects that represent the real world, as opposed to a series of computational steps used in traditional languages."
  tags:
  - mod-02
  tier: exam
- id: operating_system_os
  prompt: "operating system (OS)"
  answer: "An operating system (OS) is a set of programs for controlling and managing computer hardware and software. It provides an interface between a computer and the user and increases computer efficiency by helping users share computer resources and by performing repetitive tasks for users."
  tags:
  - mod-02
  tier: exam
- id: output_devices
  prompt: "output devices"
  answer: "An output device is capable of representing information from a computer. The form of this output might be visual, audio, or digital; examples include printers, display monitors, and plotters."
  tags:
  - mod-02
  tier: exam
- id: random_access_memory_ram
  prompt: "random access memory (RAM)"
  answer: "Random access memory (RAM) is volatile memory, in which data can be read from and written to; it is also called read-write memory."
  tags:
  - mod-02
  tier: exam
- id: read_only_memory_rom
  prompt: "read-only memory (ROM)"
  answer: "Read-only memory (ROM) is nonvolatile; data cannot be written to ROM."
  tags:
  - mod-02
  tier: exam
- id: redundant_array_of_independent_disks_rai
  prompt: "redundant array of independent disks (RAID)"
  answer: "A redundant array of independent disks (RAID) system is a collection of disk drives used for fault tolerance and improved performance and is typically found in large network systems."
  tags:
  - mod-02
  tier: exam
- id: secondary_memory
  prompt: "Secondary memory"
  answer: "Secondary memory, which is nonvolatile, holds data when the computer is off or during the course of a program’s operation. It also serves as archival storage."
  tags:
  - mod-02
  tier: exam
- id: server
  prompt: "server"
  answer: "A server is a computer and all the software for managing network resources and offering services to a network."
  tags:
  - mod-02
  tier: exam
- id: storage_area_network_san
  prompt: "storage area network (SAN)"
  answer: "A storage area network (SAN) is a dedicated high-speed network consisting of both hardware and software used to connect and manage shared storage devices, such as disk arrays, tape libraries, and optical storage devices."
  tags:
  - mod-02
  tier: exam
