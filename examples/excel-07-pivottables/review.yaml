  tier: exam
- id: drill_up
  prompt: "drill up"
  answer: "The process in data analysis in which the data view goes from the most specific to the most general."
  tags:
  - mod-17
  tier: exam
- id: drilling_down
  prompt: "drilling down"
  answer: "In Excel, the process in data analysis in which the data view goes from the most general to the most specific."
  tags:
  - mod-17
  tier: exam
- id: label_filters
  prompt: "Label filters"
  answer: "A filter applied directly to PivotTable fields that selects data based on the labels of the items in the field."
