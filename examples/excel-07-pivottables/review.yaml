  - mod-17
  tier: exam
- id: manual_filters
  prompt: "Manual filters"
  answer: "A filter applied directly to PivotTable fields that selects values selected from check boxes listing all of the unique field values."
  tags:
  - mod-17
  tier: exam
- id: refresh
  prompt: "refresh"
  answer: "To update a PivotTable so it reflects changes to the underlying data."
  tags:
  - mod-17
  tier: exam
- id: standard_pivottable
  prompt: "standard PivotTable"
  answer: "A PivotTable that summarizes data from an Excel table."
