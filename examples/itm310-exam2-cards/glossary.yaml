  refs:
  - 'Glossary: examples/mis-04-ethics-legal'
- id: fake_news
  title: Fake news
  definition: Fake news is a story or hoax created to intentionally misinform or deceive readers.
  tags:
  - mod-04
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-04-ethics-legal'
- id: general_data_protection_regulation_gdpr
  title: General Data Protection Regulation (GDPR)
  definition: The General Data Protection Regulation (GDPR) covers a series of laws that protect European Union (EU) citizens’ personal data, including genetic data, health records, racial or ethnic origin, and religious beliefs.
  tags:
  - mod-04
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-04-ethics-legal'
- id: green_computing
  title: Green computing
  definition: Green computing involves the design, manufacture, use, and disposal of computers, servers, and other computing devices so that there is minimal impact on the environment.
  tags:
  - mod-04
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-04-ethics-legal'
- id: intellectual_property
  title: Intellectual property
  definition: Intellectual property is a legal umbrella covering protections that involve copyrights, trademarks, trade secrets, and patents for “creations of the mind” developed by people or businesses.
  tags:
  - mod-04
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-04-ethics-legal'
- id: log_files
  title: Log files
  definition: Log files, which are generated by Web server software, record a user’s actions on a Web site.
  tags:
  - mod-04
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-04-ethics-legal'
- id: misinformation
  title: Misinformation
  definition: Misinformation is fake information that is distributed to an audience, regardless of intent to mislead.
  tags:
  - mod-04
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-04-ethics-legal'
- id: social_media_networking_ethics
  title: Social media networking ethics
  definition: Social media networking ethics advocates that social media should be open and provide fair access to all of its users.
  tags:
  - mod-04
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-04-ethics-legal'
- id: spam
  title: spam
  definition: Spam is an unsolicited e-mail sent for advertising purposes.
  tags:
  - mod-04
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-04-ethics-legal'
- id: access_controls
  title: Access controls
  definition: Access controls are designed to protect systems from unauthorized access in order to preserve data integrity.
  tags:
  - mod-05
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: adware
  title: Adware
  definition: Adware is a form of spyware that collects information about the user (without the user’s consent) to determine which advertisements to display in the user’s Web browser.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: asymmetric_encryption
  title: Asymmetric encryption
  definition: 'Asymmetric encryption uses two keys: a public key known to everyone and a private or secret key known only to the recipient. A message encrypted with a public key can be decrypted only with the same algorithm used by the public key and requires the recipient’s private key, too. Any people who intercept the message cannot decrypt it because they do not have the private key.'
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: authentication_tokens
  title: Authentication tokens
  definition: Authentication tokens improve security by transmitting a security token among connected applications. The user logs in once with approved credentials, and then a unique token is generated and shared with connected applications or Web sites to verify the user’s identity for a given period.
  tags:
  - mod-05
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: availability
  title: Availability
  definition: Availability means that computers and networks are operating, and that authorized users can access the information they need. It also means a quick recovery in the event of a system failure or disaster.
  tags:
  - mod-05
  - band-green
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: backdoor
  title: backdoor
  definition: A backdoor (also called a trapdoor) is a programming routine built into a system by its designer or programmer. It enables the designer or programmer to bypass system security and sneak back into the system later to access programs or files.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: baiting
  title: Baiting
  definition: Baiting is similar to phishing attacks. What distinguishes it from phishing is the promise that the baiter gives to the recipient.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: biometric_security_measures
  title: Biometric security measures
  definition: Biometric security measures use a physiological element that is unique to a person and cannot be stolen, lost, copied, or passed on to others.
  tags:
  - mod-05
  - band-green
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: black_hats
  title: Black hats
  definition: Hackers who specialize in unauthorized penetration of information systems. They attack systems for profit, fun, or political motivation or as part of a social cause. These penetration attacks often involve modifying and destroying data.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: blended_threat
  title: blended threat
  definition: A blended threat is a security threat that combines the characteristics of computer viruses, worms, and other malicious codes with vulnerabilities found on public and private networks.
  tags:
  - mod-05
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: brain_password
  title: brain password
  definition: A brain password is a digital reading of a user’s brain activity while looking at a series of images. These brain activities are recorded in a database. To log in to a system or enter a secure room, the user puts on a special hat and again watches the sequence of images. The new brain activities are compared with the ones in the database and then access is given or denied.
  tags:
  - mod-05
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: business_continuity_planning
  title: business continuity planning
  definition: Business continuity planning outlines procedures for keeping an organization operational after a natural disaster or network attack.
  tags:
  - mod-05
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: callback_modem
  title: callback modem
  definition: A callback modem verifies whether a user’s access is valid by logging the user off (after the user attempts to connect to the network) and then calling the user back at a predetermined number.
  tags:
  - mod-05
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: computer_fraud
  title: Computer fraud
  definition: Computer fraud is the unauthorized use of computer data for personal gain.
  tags:
  - mod-05
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: confidentiality
  title: Confidentiality
  definition: Confidentiality means that a system must prevent disclosing information to anyone who is not authorized to access it.
  tags:
  - mod-05
  - band-green
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: cryptojacking
  title: Cryptojacking
  definition: Cryptojacking occurs when hackers secretly use the computing power of a user to mine cryptocurrency.
  tags:
  - mod-05
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: denial_of_service_dos_attack
  title: denial-of-service (DoS) attack
  definition: A denial-of-service (DoS) attack floods a network or server with service requests to prevent legitimate users’ access to the system.
  tags:
  - mod-05
  - band-blue
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: dna_identification
  title: DNA identification
  definition: DNA identification gathers a user’s unique behavioral characteristics and then creates an “eDNA” profile that is used for identification when the user tries to log in to a system.
  tags:
  - mod-05
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: fault_tolerant_systems
  title: fault-tolerant systems
  definition: Fault-tolerant systems ensure availability in the event of a system failure by using a combination of hardware and software.
  tags:
  - mod-05
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: firewall
  title: firewall
  definition: A firewall is a combination of hardware and software that acts as a filter or barrier between a private network and external computers or networks, including the Internet. A network administrator defines rules for access, and all other data transmissions are blocked.
  tags:
  - mod-05
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: gray_hats
  title: Gray hats
  definition: As you might imagine, they are a mixture of black and white hacking. Gray hats may violate laws or ethical standards, but they do not have the malicious intent to harm a person or a system. They look for vulnerabilities in a system without the owner’s permission or knowledge. They may inform the owner that they have found vulnerabilities and will fix them for a small fee.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: integrity
  title: Integrity
  definition: Integrity refers to the accuracy of information resources within an organization.
  tags:
  - mod-05
  - band-green
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: intrusion_detection_system_ids
  title: intrusion detection system (IDS)
  definition: An intrusion detection system (IDS) can protect against both external and internal access. It is usually placed in front of a firewall and can identify attack signatures, trace patterns, generate alarms for the network administrator, and cause routers to terminate connections with suspicious sources.
  tags:
  - mod-05
  - band-blue
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: keystroke_loggers
  title: Keystroke loggers
  definition: Keystroke loggers are software or hardware devices that monitor and record keystrokes.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: logic_bomb
  title: logic bomb
  definition: A logic bomb is a type of Trojan program used to release a virus, worm, or other destructive code. Logic bombs are triggered at a certain time (sometimes the birthday of a famous person) or by a specific event, such as a user pressing the Enter key or running a certain program.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: macro_viruses
  title: Macro viruses
  definition: A type of virus that uses a program’s own macro programming language to distribute the virus.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: nonrepudiation
  title: nonrepudiation
  definition: Nonrepudiation is a method for binding all parties to a contract.
  tags:
  - mod-05
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: password
  title: password
  definition: A password is a combination of numbers, characters, and symbols that a user enters to gain access to a system.
  tags:
  - mod-05
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: pharming
  title: Pharming
  definition: Similar to phishing, pharming directs Internet users to fraudulent Web sites with the intention of stealing their personal information, such as Social Security numbers, passwords, bank account numbers, and credit card numbers. The difference is that pharmers usually hijack an official Web site, then alter its IP address so that users who enter the correct Web address are directed to the pharmer’s fraudulent Web site.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: phishing
  title: Phishing
  definition: Phishing is the transmission of fraudulent e-mails that seem to come from legitimate sources, such as a bank or university.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: physical_security_measures
  title: Physical security measures
  definition: Physical security measures primarily control access to computers and networks, and they include devices for securing computers and peripherals from theft.
  tags:
  - mod-05
  - band-green
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: pki_public_key_infrastructure
  title: PKI (public key infrastructure)
  definition: A PKI (public key infrastructure) enables users of a public network such as the Internet to securely and privately exchange data through the use of a pair of keys—a public one and a private one—that is obtained from a trusted authority and shared through that authority.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: quid_pro_quo
  title: quid pro quo
  definition: Similar to baiting, quid pro quo involves a hacker requesting the exchange of critical data or login information for a service or prize.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: rootkit
  title: rootkit
  definition: A rootkit is a series of software tools that enable an unauthorized user to gain access to a computer or network system without being detected.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: script_kiddies
  title: Script kiddies
  definition: Inexperienced, usually young hackers who use programs that others have developed to attack computer and network systems and deface Web sites.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: secure_sockets_layer_ssl
  title: Secure Sockets Layer (SSL)
  definition: Secure Sockets Layer (SSL) is a commonly used encryption protocol that manages transmission security on the Internet.
  tags:
  - mod-05
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: sniffing
  title: Sniffing
  definition: Sniffing is capturing and recording network traffic.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: social_engineering
  title: social engineering
  definition: Social engineering takes advantage of the human element of a security system to trick others into revealing private information.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: spoofing
  title: Spoofing
  definition: Spoofing is an attempt to gain access to a network by posing as an authorized user in order to find sensitive information, such as passwords and credit card information.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: spyware
  title: Spyware
  definition: Spyware is software that secretly gathers information about users while they browse the Web.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: symmetric_encryption
  title: symmetric encryption
  definition: In symmetric encryption (also called secret key encryption), the same key is used to encrypt and decrypt the message. The sender and receiver must agree on the key and keep it secret.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: transport_layer_security_tls
  title: Transport Layer Security (TLS)
  definition: Transport Layer Security (TLS) is a cryptographic protocol that ensures data security and integrity over public networks, such as the Internet.
  tags:
  - mod-05
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: trojan_programs
  title: Trojan programs
  definition: A Trojan program contains code intended to disrupt a computer, network, or Web site, and it is usually hidden inside a popular program. Users run the program, unaware that the malicious program is also running in the background.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: virtual_private_network_vpn
  title: virtual private network (VPN)
  definition: A virtual private network (VPN) provides a secure “tunnel” through the Internet for transmitting messages and data via a private network.
  tags:
  - mod-05
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: virus
  title: virus
  definition: A virus consists of self-propagating program code that is triggered by a specified time or event. When the infected program or operating system is used, the virus attaches itself to other files, and the cycle continues.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: white_hats
  title: White hats
  definition: Also known as ethical hackers, these are computer security experts who specialize in penetration testing and other testing methods to ensure that a company’s information systems are secure.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: worm
  title: worm
  definition: A worm travels from computer to computer in a network, but it does not usually erase data. Unlike viruses, worms are independent programs that can spread themselves without having to be attached to a host program.
  tags:
  - mod-05
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: zero_login
  title: Zero login
  definition: Zero login assumes that devices will be smart and secure enough to quickly recognize users by their unique features, such as their voice and their typing patterns.
  tags:
  - mod-05
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: zero_trust_security
  title: Zero trust security
  definition: Zero trust security requires every person and every device that accesses a network to be secure, regardless of whether the access is within the organization or outside of it.
  tags:
  - mod-05
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-05-security'
- id: global_information_system_gis
  title: global information system (GIS)
  definition: A global information system (GIS) works across national borders, facilitates communication between headquarters and subsidiaries in other countries, and incorporates all the technologies and applications found in a typical information system to gather, store, manipulate, and transmit data across cultural and geographic boundaries.
  context: Not the same GIS as the geographic information system in MIS 8. The course abbreviates both as GIS.
  tags:
  - mod-06
  - band-green
  tier: exam
  refs:
  - 'Glossary: examples/mis-06-global'
- id: global_structure
  title: global structure
  definition: A global structure uses highly centralized information systems. Subsidiaries have little autonomy and rely on headquarters for all process and control decisions as well as system design and implementation.
  tags:
  - mod-06
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-06-global'
- id: global_supply_chain_management
  title: Global supply chain management
  definition: Global supply chain management incorporates management processes around the globe that integrate the network of suppliers, manufacturers, warehouses, and retail outlets in order to source high-quality raw materials, efficiently convert them to finished goods, and ship them in the right quantities to the right locations in a timely manner with the highest possible quality.
  tags:
  - mod-06
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-06-global'
- id: international_structure
  title: international structure
  definition: An organization with an international structure operates much like a multinational corporation, but subsidiaries depend on headquarters more for process and production decisions.
  tags:
  - mod-06
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-06-global'
- id: multinational_corporations_mncs
  title: multinational corporations (MNCs)
  definition: A multinational corporation (MNC) is an organization with assets and operations in at least one country other than its home country. An MNC delivers products and services across national borders and is usually centrally managed from its headquarters.
  tags:
  - mod-06
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-06-global'
- id: multinational_structure
  title: multinational structure
  definition: In a multinational structure, production, sales, and marketing are decentralized, and financial management remains the parent’s responsibility.
  tags:
  - mod-06
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-06-global'
- id: offshore_outsourcing
  title: Offshore outsourcing
  definition: With offshore outsourcing, an organization chooses an outsourcing firm in another country that can provide needed services and products.
  tags:
  - mod-06
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-06-global'
- id: transborder_data_flow_tdf
  title: transborder data flow (TDF)
  definition: Transborder data flow (TDF) restricts what type of data can be captured and transmitted in foreign countries.
  tags:
  - mod-06
  - band-red
  tier: exam
  refs:
  - 'Glossary: examples/mis-06-global'
- id: transnational_structure
  title: transnational structure
  definition: In an organization with a transnational structure, the parent and all the subsidiaries work together in designing policies, procedures, and logistics for delivering products and services to the right market.
  tags:
  - mod-06
  - band-yellow
  tier: exam
  refs:
  - 'Glossary: examples/mis-06-global'
- id: exploratory_analysis
  title: Exploratory analysis
  definition: 'Looking through data without a fixed question, to understand it and find out what might be worth telling someone. Knaflic''s picture: opening many oysters to find a few pearls.'
  status: proposed
  tags:
  - knaflic-ch1
  - band-yellow
  tier: exam
  refs:
  - 'Exam 2 Study Guide: Knaflic Ch. 1'
  - Exam 2 Review deck, slide 42
  - 'Glossary: examples/exam2-knaflic-board'
- id: explanatory_analysis
  title: Explanatory analysis
  definition: Communicating one specific finding you already have to a specific audience; the pearl, not the oysters.
  status: proposed
  tags:
  - knaflic-ch1
  - band-yellow
  tier: exam
  refs:
  - 'Exam 2 Study Guide: Knaflic Ch. 1'
  - Exam 2 Review deck, slide 42
  - 'Glossary: examples/exam2-knaflic-board'
- id: audience
  title: Audience
  definition: The people you are communicating to. Narrow it as far as you can; the review deck asks whether to present to the widest possible audience or a specific one, and the specific one is the answer.
  status: proposed
  tags:
  - knaflic-ch1
  - band-yellow
  tier: exam
  refs:
  - Exam 2 Review deck, slide 42
  - 'Glossary: examples/exam2-knaflic-board'
- id: presentation_context
  title: Presentation context
  definition: 'What you must settle before building anything: who the audience is, what you need them to know or do, and how the data can help you make the point.'
  status: proposed
  tags:
  - knaflic-ch1
  - band-green
  tier: exam
  refs:
  - 'Exam 2 Study Guide: Knaflic Ch. 1'
  - Exam 2 Review deck, slide 41
  - 'Glossary: examples/exam2-knaflic-board'
- id: big_idea
  title: Big Idea
  definition: A single complete sentence that states your point of view and what is at stake.
  status: proposed
  tags:
  - knaflic-ch1
  - band-red
  tier: exam
  refs:
  - 'Exam 2 Study Guide: Knaflic Ch. 1'
  - Exam 2 Review deck, slide 41
  - 'Glossary: examples/exam2-knaflic-board'
- id: storyboarding
  title: Storyboarding
  definition: Sketching the outline of a presentation, one note per slide, and rearranging it before building anything.
  status: proposed
  tags:
  - knaflic-ch1
  - band-red
  tier: exam
  refs:
  - 'Exam 2 Study Guide: Knaflic Ch. 1'
  - Exam 2 Review deck, slide 41
  - 'Glossary: examples/exam2-knaflic-board'
- id: communication_method
  title: Communication method
  definition: How the message is delivered, such as a live presentation or a document read alone. A live talk can carry less on the slide because the speaker adds the rest; a document must stand on its own.
  status: proposed
  tags:
  - knaflic-ch1
  - band-yellow
  tier: exam
  refs:
  - 'Exam 2 Study Guide: Knaflic Ch. 1'
  - Exam 2 Review deck, slide 41
  - 'Glossary: examples/exam2-knaflic-board'
- id: get_data
  title: Get data
  definition: The Power BI command that connects to a data source and starts an import.
  tags:
  - power-bi
  - band-green
  tier: support
  refs:
  - Exam 2 Review deck, slides 44, 46 (D)
  - itm310-wk07-power-bi glossary
  - 'Glossary: examples/exam2-knaflic-board'
- id: calculated_measure
  title: Calculated measure
  definition: A calculation that belongs to the entire data set, not to a table. Use it for all aggregate functions. Computed on the fly in a visual, it adapts to whatever filters are applied, and it can be used in other calculations.
  tags:
  - power-bi
  - dax
  - band-yellow
  tier: exam
  refs:
  - Exam 2 Review deck, slide 45
  - itm310-wk07-power-bi glossary
  - 'Glossary: examples/exam2-knaflic-board'
- id: dax_function
  title: DAX function
  definition: A function in a Power BI formula. In Total Sales = SUM(Sales[SalesAmount]), SUM is the DAX function and adds up all of the numbers in the Sales[SalesAmount] column.
  tags:
  - power-bi
  - dax
  - band-green
  tier: exam
  refs:
  - Exam 2 Review deck, slide 45
  - 'Glossary: examples/exam2-knaflic-board'
- id: argument
  title: Argument
  definition: A value or expression placed inside a function's parentheses. A function requires an argument to pass it a value; SUM(Sales[SalesAmount]) has one.
  tags:
  - power-bi
  - dax
  - band-green
  tier: exam
  refs:
  - Exam 2 Review deck, slides 44-45
  - 'Glossary: examples/exam2-knaflic-board'
- id: crisp_dm
  title: CRISP-DM
  definition: 'CRoss-Industry Standard Process for Data Mining: a BI and data mining project methodology. Non-proprietary, industry-neutral, and tool-neutral, with a life cycle of six phases.'
  context: A standard process makes BI reliable and repeatable by people with little BI background.
  tags:
  - crisp-dm
  - band-red
  tier: exam
  refs:
  - ITM 310 Week 7, slides 5-8
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: business_understanding
  title: Business Understanding (CRISP-DM phase 1)
  definition: Understanding the project objectives and requirements from a business perspective, converting this knowledge into a BI problem definition, and developing a preliminary plan designed to achieve the objectives.
  tags:
  - crisp-dm
  - band-blue
  tier: exam
  refs:
  - ITM 310 Week 7, slides 10, 12
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: data_understanding
  title: Data Understanding (CRISP-DM phase 2)
  definition: Starts with an initial data collection and proceeds with activities to get familiar with the data, identify data quality problems, discover first insights, and detect interesting subsets to form hypotheses for hidden information.
  tags:
  - crisp-dm
  - band-blue
  tier: exam
  refs:
  - ITM 310 Week 7, slide 13
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: data_preparation
  title: Data Preparation (CRISP-DM phase 3)
  definition: Covers all activities necessary for constructing the final dataset from the initial raw data. Tasks are likely to be performed multiple times and not in any prescribed order.
  context: Can easily take 80% to 90% of a project's time.
  tags:
  - crisp-dm
  - band-blue
  tier: exam
  refs:
  - ITM 310 Week 7, slide 14
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: modeling_phase
  title: Modeling (CRISP-DM phase 4)
  definition: 'Various modeling techniques are selected and applied: select the techniques, build the models, and assess them. It may be necessary to step back to the data preparation phase.'
  tags:
  - crisp-dm
  - band-blue
  tier: exam
  refs:
  - ITM 310 Week 7, slides 11, 15
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: evaluation_phase
  title: Evaluation (CRISP-DM phase 5)
  definition: Evaluating whether the business objectives were achieved. For descriptive analytics, the question is whether the reporting satisfies the project objectives.
  tags:
  - crisp-dm
  - band-blue
  tier: exam
  refs:
  - ITM 310 Week 7, slides 11, 16
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: deployment_phase
  title: Deployment (CRISP-DM phase 6)
  definition: Determining how the results need to be used, who needs to use them, and how often, and implementing a repeatable BI process.
  tags:
  - crisp-dm
  - band-blue
  tier: exam
  refs:
  - ITM 310 Week 7, slides 11, 17
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: etl
  title: ETL (Extraction, Transformation, and Loading)
  definition: 'Extraction, Transformation, and Loading: selecting tables, records, and attributes, then transforming and cleaning the data.'
  tags:
  - crisp-dm
  - power-bi
  - band-green
  tier: exam
  refs:
  - ITM 310 Week 7, slide 10
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: query_editor
  title: Power Query Editor (Query Editor)
  definition: Power BI's ETL tool, used for shaping and mashing up data. It can import and merge data from a variety of sources, append tables together, and set table and column properties such as data types.
  context: Microsoft's current name is Power Query Editor, opened with Transform data on the Home tab. The Week 7 slides call it the Query Editor.
  tags:
  - power-bi
  - band-green
  tier: exam
  refs:
  - ITM 310 Week 7, slides 13-14, 30
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: dax
  title: DAX (Data Analysis Expressions)
  definition: A library of functions and operators used to build formulas in Power BI Desktop (and other Microsoft data systems). Starts similar to Excel functions, but goes far beyond.
  tags:
  - power-bi
  - dax
  - band-red
  tier: exam
  refs:
  - ITM 310 Week 7, slides 20-23
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: calculated_column
  title: Calculated column
  definition: A calculation added as a new column in a table, with a new value in each row. Computed at refresh time. Good for simple calculations, or when you need to slice or filter on the values.
  tags:
  - power-bi
  - dax
  - band-yellow
  tier: exam
  refs:
  - ITM 310 Week 7, slides 24, 31
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: relationship
  title: Relationship (Power BI model)
  definition: A link between tables in the data model, created on Primary Key and Foreign Key fields that match (have the same ranges of values).
  tags:
  - power-bi
  - modeling
  - band-green
  tier: exam
  refs:
  - ITM 310 Week 7, slide 20
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: kpi
  title: Key performance indicator (KPI)
  definition: A measurement used by business to measure achievement of a specific goal.
  context: In Power BI, KPIs are built from calculated measures.
  tags:
  - power-bi
  - band-red
  tier: exam
  refs:
  - MindTap course glossary, Excel module 10
  - ITM 310 Week 7, slide 20
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: power_bi_reports
  title: Power BI reports
  definition: 'Power BI''s data visualization tools: interactive visual reports that let decision makers quickly and visually explore their data.'
  tags:
  - power-bi
  - band-red
  tier: exam
  refs:
  - ITM 310 Week 7, slide 16
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: power_bi_desktop
  title: Power BI Desktop
  definition: Power BI on a single machine. On-premise.
  tags:
  - power-bi
  - deployment
  - band-yellow
  tier: exam
  refs:
  - ITM 310 Week 7, slide 17
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: power_bi_service
  title: Power BI service
  definition: Power BI via Office 365. Cloud based, so strictly off-premise.
  tags:
  - power-bi
  - deployment
  - band-yellow
  tier: exam
  refs:
  - ITM 310 Week 7, slide 17
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: power_bi_mobile
  title: Power BI Mobile
  definition: Power BI on smartphones and tablets, one of the deployment options.
  tags:
  - power-bi
  - deployment
  - band-yellow
  tier: exam
  refs:
  - ITM 310 Week 7, slide 17 and notes to slide 16
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: delimiter
  title: Delimiter
  definition: A separator such as a space, comma, or semicolon between elements in imported data.
  tags:
  - power-bi
  - etl
  - band-red
  tier: exam
  refs:
  - MindTap course glossary, Power Query module
  - ITM 310 Week 7, slide 30
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: applied_steps
  title: Applied Steps
  definition: The Query Editor's list of every shaping step, in order. Power BI replays the list each time the data refreshes.
  tags:
  - support
  - power-bi
  - band-blue
  tier: support
  refs:
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: close_and_load
  title: Close & Load
  definition: The Query Editor command that finishes shaping and loads the data into the model.
  tags:
  - support
  - power-bi
  - band-blue
  tier: support
  refs:
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: star_schema
  title: Star schema
  definition: A star schema is a type of relational data structure optimized for analytics.
  context: A way of arranging a data model with one central table of transactions surrounded by lookup tables, each joined to it by a key.
  tags:
  - modeling
  - band-green
  tier: exam
  refs:
  - ITM 310 Week 7 technical assignment, Star Schema and Visualization
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: fact_table
  title: Fact table
  definition: In a star schema, the central entity is called the Fact table.
  context: One row per transaction or event, holding the numbers being measured and the keys that point to the dimension tables.
  tags:
  - modeling
  - band-green
  tier: exam
  refs:
  - ITM 310 Week 7 technical assignment, Star Schema and Visualization
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: dimension_table
  title: Dimension table
  definition: In a star schema, the central entity is called the Fact table. All other tables are called Dimension tables and are directly connected to the Fact table.
  context: Lookup tables such as products, stores, or dates that describe the rows in the fact table.
  tags:
  - modeling
  - band-green
  tier: exam
  refs:
  - ITM 310 Week 7 technical assignment, Star Schema and Visualization
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: data_view
  title: Table view
  definition: The Power BI Desktop view that shows the rows of each table. The course recommends creating calculations here, from the Modeling tab.
  context: Microsoft's current name is Table view, one of the three view icons on the left side of Power BI Desktop. The Week 7 slides call it the Data view.
  tags:
  - support
  - power-bi
  - band-green
  tier: support
  refs:
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: report_canvas
  title: Report canvas
  definition: The page in Power BI Desktop where visuals are built by dragging fields onto it.
  tags:
  - support
  - power-bi
  - band-green
  tier: support
  refs:
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: visual_details
  title: Visual details area
  definition: The course's name for the area under Visualizations where fields go into the axes, legend, values, and details of the selected visual.
  tags:
  - support
  - power-bi
  - band-green
  tier: support
  refs:
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: slicer
  title: Slicer
  definition: A visual on the report canvas that filters the other visuals on the page when you pick a value.
  tags:
  - support
  - power-bi
  - band-yellow
  tier: support
  refs:
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: filter_pane
  title: Filters pane
  definition: Filters a visual, page, or report the way a slicer does, but is not shown on the canvas.
  tags:
  - support
  - power-bi
  - band-green
  tier: support
  refs:
  - 'Glossary: examples/itm310-wk07-power-bi'
- id: aggregation
  title: Aggregation
  definition: 'How Power BI combines a field''s values in a visual: sum by default, or average, count, minimum, or maximum.'
  tags:
  - support
  - power-bi
  - band-red
  tier: support
  refs:
  - 'Glossary: examples/itm310-wk07-power-bi'
