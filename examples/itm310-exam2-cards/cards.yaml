- band: yellow
  module: pbi
  q: "Calculated column vs calculated measure?"
  a: "Column: a new value in every row, computed at refresh; good when you slice or filter on it. Measure: belongs to the whole data set, computed on the fly, changes with the filters; use it for aggregates."
  terms: [calculated_column, calculated_measure]
- band: yellow
  module: pbi
  q: "Power BI Desktop, service, or Mobile: which one is strictly cloud based?"
  a: "The service (through Office 365). Desktop runs on one machine, on premises. Mobile runs on phones and tablets."
  terms: [power_bi_desktop, power_bi_service, power_bi_mobile]
- band: yellow
  module: pbi
  q: "Slicer vs Filters pane?"
  a: "Both filter. A slicer is a visual on the report canvas; the Filters pane does the same job without showing on the canvas."
  terms: [slicer]

