- id: denial_of_service_dos_attack
  prompt: denial-of-service (DoS) attack
  answer: A denial-of-service (DoS) attack floods a network or server with service requests to prevent legitimate users’ access to the system.
  tags:
  - mod-05
  - band-blue
  tier: exam
- id: dna_identification
  prompt: DNA identification
  answer: DNA identification gathers a user’s unique behavioral characteristics and then creates an “eDNA” profile that is used for identification when the user tries to log in to a system.
  tags:
  - mod-05
  - band-red
  tier: exam
- id: fault_tolerant_systems
  prompt: fault-tolerant systems
  answer: Fault-tolerant systems ensure availability in the event of a system failure by using a combination of hardware and software.
  tags:
  - mod-05
  - band-red
  tier: exam
- id: firewall
  prompt: firewall
  answer: A firewall is a combination of hardware and software that acts as a filter or barrier between a private network and external computers or networks, including the Internet. A network administrator defines rules for access, and all other data transmissions are blocked.
  tags:
  - mod-05
  - band-red
  tier: exam
- id: gray_hats
  prompt: Gray hats
  answer: As you might imagine, they are a mixture of black and white hacking. Gray hats may violate laws or ethical standards, but they do not have the malicious intent to harm a person or a system. They look for vulnerabilities in a system without the owner’s permission or knowledge. They may inform the owner that they have found vulnerabilities and will fix them for a small fee.
  tags:
  - mod-05
  - band-yellow
  tier: exam
- id: integrity
  prompt: Integrity
  answer: Integrity refers to the accuracy of information resources within an organization.
  tags:
  - mod-05
  - band-green
  tier: exam
- id: intrusion_detection_system_ids
  prompt: intrusion detection system (IDS)
  answer: An intrusion detection system (IDS) can protect against both external and internal access. It is usually placed in front of a firewall and can identify attack signatures, trace patterns, generate alarms for the network administrator, and cause routers to terminate connections with suspicious sources.
  tags:
  - mod-05
  - band-blue
  tier: exam
- id: keystroke_loggers
  prompt: Keystroke loggers
  answer: Keystroke loggers are software or hardware devices that monitor and record keystrokes.
  tags:
  - mod-05
  - band-yellow
  tier: exam
- id: logic_bomb
  prompt: logic bomb
  answer: A logic bomb is a type of Trojan program used to release a virus, worm, or other destructive code. Logic bombs are triggered at a certain time (sometimes the birthday of a famous person) or by a specific event, such as a user pressing the Enter key or running a certain program.
  tags:
  - mod-05
  - band-yellow
  tier: exam
- id: macro_viruses
  prompt: Macro viruses
  answer: A type of virus that uses a program’s own macro programming language to distribute the virus.
  tags:
  - mod-05
  - band-yellow
  tier: exam
- id: nonrepudiation
  prompt: nonrepudiation
  answer: Nonrepudiation is a method for binding all parties to a contract.
  tags:
  - mod-05
  - band-red
  tier: exam
- id: password
  prompt: password
  answer: A password is a combination of numbers, characters, and symbols that a user enters to gain access to a system.
  tags:
  - mod-05
  - band-red
  tier: exam
- id: pharming
  prompt: Pharming
  answer: Similar to phishing, pharming directs Internet users to fraudulent Web sites with the intention of stealing their personal information, such as Social Security numbers, passwords, bank account numbers, and credit card numbers. The difference is that pharmers usually hijack an official Web site, then alter its IP address so that users who enter the correct Web address are directed to the pharmer’s fraudulent Web site.
  tags:
  - mod-05
  - band-yellow
  tier: exam
- id: phishing
  prompt: Phishing
  answer: Phishing is the transmission of fraudulent e-mails that seem to come from legitimate sources, such as a bank or university.
  tags:
  - mod-05
  - band-yellow
  tier: exam
- id: physical_security_measures
  prompt: Physical security measures
  answer: Physical security measures primarily control access to computers and networks, and they include devices for securing computers and peripherals from theft.
  tags:
  - mod-05
  - band-green
  tier: exam
- id: pki_public_key_infrastructure
  prompt: PKI (public key infrastructure)
  answer: A PKI (public key infrastructure) enables users of a public network such as the Internet to securely and privately exchange data through the use of a pair of keys—a public one and a private one—that is obtained from a trusted authority and shared through that authority.
  tags:
  - mod-05
  - band-yellow
  tier: exam
- id: quid_pro_quo
  prompt: quid pro quo
  answer: Similar to baiting, quid pro quo involves a hacker requesting the exchange of critical data or login information for a service or prize.
  tags:
  - mod-05
  - band-yellow
  tier: exam
- id: rootkit
  prompt: rootkit
  answer: A rootkit is a series of software tools that enable an unauthorized user to gain access to a computer or network system without being detected.
  tags:
  - mod-05
  - band-yellow
  tier: exam
- id: script_kiddies
  prompt: Script kiddies
  answer: Inexperienced, usually young hackers who use programs that others have developed to attack computer and network systems and deface Web sites.
  tags:
  - mod-05
  - band-yellow
  tier: exam
- id: secure_sockets_layer_ssl
  prompt: Secure Sockets Layer (SSL)
  answer: Secure Sockets Layer (SSL) is a commonly used encryption protocol that manages transmission security on the Internet.
  tags:
  - mod-05
  - band-red
  tier: exam
- id: sniffing
  prompt: Sniffing
  answer: Sniffing is capturing and recording network traffic.
  tags:
  - mod-05
  - band-yellow
  tier: exam
- id: social_engineering
  prompt: social engineering
  answer: Social engineering takes advantage of the human element of a security system to trick others into revealing private information.
  tags:
  - mod-05
  - band-yellow
  tier: exam
- id: spoofing
  prompt: Spoofing
  answer: Spoofing is an attempt to gain access to a network by posing as an authorized user in order to find sensitive information, such as passwords and credit card information.
  tags:
  - mod-05
  - band-yellow
  tier: exam
- id: spyware
  prompt: Spyware
  answer: Spyware is software that secretly gathers information about users while they browse the Web.
  tags:
  - mod-05
  - band-yellow
  tier: exam
- id: symmetric_encryption
  prompt: symmetric encryption
  answer: In symmetric encryption (also called secret key encryption), the same key is used to encrypt and decrypt the message. The sender and receiver must agree on the key and keep it secret.
  tags:
  - mod-05
  - band-yellow
  tier: exam
- id: transport_layer_security_tls
  prompt: Transport Layer Security (TLS)
  answer: Transport Layer Security (TLS) is a cryptographic protocol that ensures data security and integrity over public networks, such as the Internet.
  tags:
  - mod-05
  - band-red
  tier: exam
- id: trojan_programs
  prompt: Trojan programs
  answer: A Trojan program contains code intended to disrupt a computer, network, or Web site, and it is usually hidden inside a popular program. Users run the program, unaware that the malicious program is also running in the background.
  tags:
  - mod-05
  - band-yellow
  tier: exam
- id: virtual_private_network_vpn
  prompt: virtual private network (VPN)
  answer: A virtual private network (VPN) provides a secure “tunnel” through the Internet for transmitting messages and data via a private network.
  tags:
  - mod-05
  - band-red
  tier: exam
- id: virus
  prompt: virus
  answer: A virus consists of self-propagating program code that is triggered by a specified time or event. When the infected program or operating system is used, the virus attaches itself to other files, and the cycle continues.
  tags:
  - mod-05
  - band-yellow
  tier: exam
- id: white_hats
  prompt: White hats
  answer: Also known as ethical hackers, these are computer security experts who specialize in penetration testing and other testing methods to ensure that a company’s information systems are secure.
  tags:
  - mod-05
  - band-yellow
  tier: exam
- id: worm
  prompt: worm
  answer: A worm travels from computer to computer in a network, but it does not usually erase data. Unlike viruses, worms are independent programs that can spread themselves without having to be attached to a host program.
  tags:
  - mod-05
  - band-yellow
  tier: exam
- id: zero_login
  prompt: Zero login
  answer: Zero login assumes that devices will be smart and secure enough to quickly recognize users by their unique features, such as their voice and their typing patterns.
  tags:
  - mod-05
  - band-red
  tier: exam
- id: zero_trust_security
  prompt: Zero trust security
  answer: Zero trust security requires every person and every device that accesses a network to be secure, regardless of whether the access is within the organization or outside of it.
  tags:
  - mod-05
  - band-red
  tier: exam
- id: global_information_system_gis
  prompt: global information system (GIS)
  answer: A global information system (GIS) works across national borders, facilitates communication between headquarters and subsidiaries in other countries, and incorporates all the technologies and applications found in a typical information system to gather, store, manipulate, and transmit data across cultural and geographic boundaries.
  tags:
  - mod-06
  - band-green
  tier: exam
- id: global_structure
  prompt: global structure
  answer: A global structure uses highly centralized information systems. Subsidiaries have little autonomy and rely on headquarters for all process and control decisions as well as system design and implementation.
  tags:
  - mod-06
  - band-yellow
  tier: exam
- id: global_supply_chain_management
  prompt: Global supply chain management
  answer: Global supply chain management incorporates management processes around the globe that integrate the network of suppliers, manufacturers, warehouses, and retail outlets in order to source high-quality raw materials, efficiently convert them to finished goods, and ship them in the right quantities to the right locations in a timely manner with the highest possible quality.
  tags:
  - mod-06
  - band-red
  tier: exam
- id: international_structure
  prompt: international structure
  answer: An organization with an international structure operates much like a multinational corporation, but subsidiaries depend on headquarters more for process and production decisions.
  tags:
  - mod-06
  - band-yellow
  tier: exam
- id: multinational_corporations_mncs
  prompt: multinational corporations (MNCs)
  answer: A multinational corporation (MNC) is an organization with assets and operations in at least one country other than its home country. An MNC delivers products and services across national borders and is usually centrally managed from its headquarters.
  tags:
  - mod-06
  - band-red
  tier: exam
- id: multinational_structure
  prompt: multinational structure
  answer: In a multinational structure, production, sales, and marketing are decentralized, and financial management remains the parent’s responsibility.
  tags:
  - mod-06
  - band-yellow
  tier: exam
- id: offshore_outsourcing
  prompt: Offshore outsourcing
  answer: With offshore outsourcing, an organization chooses an outsourcing firm in another country that can provide needed services and products.
  tags:
  - mod-06
  - band-red
  tier: exam
- id: transborder_data_flow_tdf
  prompt: transborder data flow (TDF)
  answer: Transborder data flow (TDF) restricts what type of data can be captured and transmitted in foreign countries.
  tags:
  - mod-06
  - band-red
  tier: exam
- id: transnational_structure
  prompt: transnational structure
  answer: In an organization with a transnational structure, the parent and all the subsidiaries work together in designing policies, procedures, and logistics for delivering products and services to the right market.
  tags:
  - mod-06
  - band-yellow
  tier: exam
- id: exploratory_analysis
  prompt: Exploratory analysis
  answer: 'Looking through data without a fixed question, to understand it and find out what might be worth telling someone. Knaflic''s picture: opening many oysters to find a few pearls.'
  tags:
  - knaflic-ch1
  - band-yellow
  tier: exam
- id: explanatory_analysis
  prompt: Explanatory analysis
  answer: Communicating one specific finding you already have to a specific audience; the pearl, not the oysters.
  tags:
  - knaflic-ch1
  - band-yellow
  tier: exam
- id: audience
  prompt: Audience
  answer: The people you are communicating to. Narrow it as far as you can; the review deck asks whether to present to the widest possible audience or a specific one, and the specific one is the answer.
  tags:
  - knaflic-ch1
  - band-yellow
  tier: exam
- id: presentation_context
  prompt: Presentation context
  answer: 'What you must settle before building anything: who the audience is, what you need them to know or do, and how the data can help you make the point.'
  tags:
  - knaflic-ch1
  - band-green
  tier: exam
- id: big_idea
  prompt: Big Idea
  answer: A single complete sentence that states your point of view and what is at stake.
  tags:
  - knaflic-ch1
  - band-red
  tier: exam
- id: storyboarding
  prompt: Storyboarding
  answer: Sketching the outline of a presentation, one note per slide, and rearranging it before building anything.
  tags:
  - knaflic-ch1
  - band-red
  tier: exam
- id: communication_method
  prompt: Communication method
  answer: How the message is delivered, such as a live presentation or a document read alone. A live talk can carry less on the slide because the speaker adds the rest; a document must stand on its own.
  tags:
  - knaflic-ch1
  - band-yellow
  tier: exam
- id: get_data
  prompt: Get data
  answer: The Power BI command that connects to a data source and starts an import.
  tags:
  - power-bi
  - band-green
  tier: support
- id: calculated_measure
  prompt: Calculated measure
  answer: A calculation that belongs to the entire data set, not to a table. Use it for all aggregate functions. Computed on the fly in a visual, it adapts to whatever filters are applied, and it can be used in other calculations.
  tags:
  - power-bi
  - dax
  - band-yellow
  tier: exam
- id: dax_function
  prompt: DAX function
  answer: A function in a Power BI formula. In Total Sales = SUM(Sales[SalesAmount]), SUM is the DAX function and adds up all of the numbers in the Sales[SalesAmount] column.
  tags:
  - power-bi
  - dax
  - band-green
  tier: exam
- id: argument
  prompt: Argument
  answer: A value or expression placed inside a function's parentheses. A function requires an argument to pass it a value; SUM(Sales[SalesAmount]) has one.
  tags:
  - power-bi
  - dax
  - band-green
  tier: exam
- id: crisp_dm
  prompt: CRISP-DM
  answer: 'CRoss-Industry Standard Process for Data Mining: a BI and data mining project methodology. Non-proprietary, industry-neutral, and tool-neutral, with a life cycle of six phases.'
  tags:
  - crisp-dm
  - band-red
  tier: exam
- id: business_understanding
  prompt: Business Understanding (CRISP-DM phase 1)
  answer: Understanding the project objectives and requirements from a business perspective, converting this knowledge into a BI problem definition, and developing a preliminary plan designed to achieve the objectives.
  tags:
  - crisp-dm
  - band-blue
  tier: exam
- id: data_understanding
  prompt: Data Understanding (CRISP-DM phase 2)
  answer: Starts with an initial data collection and proceeds with activities to get familiar with the data, identify data quality problems, discover first insights, and detect interesting subsets to form hypotheses for hidden information.
  tags:
  - crisp-dm
  - band-blue
  tier: exam
- id: data_preparation
  prompt: Data Preparation (CRISP-DM phase 3)
  answer: Covers all activities necessary for constructing the final dataset from the initial raw data. Tasks are likely to be performed multiple times and not in any prescribed order.
  tags:
  - crisp-dm
  - band-blue
  tier: exam
- id: modeling_phase
  prompt: Modeling (CRISP-DM phase 4)
  answer: 'Various modeling techniques are selected and applied: select the techniques, build the models, and assess them. It may be necessary to step back to the data preparation phase.'
  tags:
  - crisp-dm
  - band-blue
  tier: exam
- id: evaluation_phase
  prompt: Evaluation (CRISP-DM phase 5)
  answer: Evaluating whether the business objectives were achieved. For descriptive analytics, the question is whether the reporting satisfies the project objectives.
  tags:
  - crisp-dm
  - band-blue
  tier: exam
- id: deployment_phase
  prompt: Deployment (CRISP-DM phase 6)
  answer: Determining how the results need to be used, who needs to use them, and how often, and implementing a repeatable BI process.
  tags:
  - crisp-dm
  - band-blue
  tier: exam
- id: etl
  prompt: ETL (Extraction, Transformation, and Loading)
  answer: 'Extraction, Transformation, and Loading: selecting tables, records, and attributes, then transforming and cleaning the data.'
  tags:
  - crisp-dm
  - power-bi
  - band-green
  tier: exam
- id: query_editor
  prompt: Power Query Editor (Query Editor)
  answer: Power BI's ETL tool, used for shaping and mashing up data. It can import and merge data from a variety of sources, append tables together, and set table and column properties such as data types.
  tags:
  - power-bi
  - band-green
  tier: exam
- id: dax
  prompt: DAX (Data Analysis Expressions)
  answer: A library of functions and operators used to build formulas in Power BI Desktop (and other Microsoft data systems). Starts similar to Excel functions, but goes far beyond.
  tags:
  - power-bi
  - dax
  - band-red
  tier: exam
- id: calculated_column
  prompt: Calculated column
  answer: A calculation added as a new column in a table, with a new value in each row. Computed at refresh time. Good for simple calculations, or when you need to slice or filter on the values.
  tags:
  - power-bi
  - dax
  - band-yellow
  tier: exam
- id: relationship
  prompt: Relationship (Power BI model)
  answer: A link between tables in the data model, created on Primary Key and Foreign Key fields that match (have the same ranges of values).
  tags:
  - power-bi
  - modeling
  - band-green
  tier: exam
- id: kpi
  prompt: Key performance indicator (KPI)
  answer: A measurement used by business to measure achievement of a specific goal.
  tags:
  - power-bi
  - band-red
  tier: exam
- id: power_bi_reports
  prompt: Power BI reports
  answer: 'Power BI''s data visualization tools: interactive visual reports that let decision makers quickly and visually explore their data.'
  tags:
  - power-bi
  - band-red
  tier: exam
- id: power_bi_desktop
  prompt: Power BI Desktop
  answer: Power BI on a single machine. On-premise.
  tags:
  - power-bi
  - deployment
  - band-yellow
  tier: exam
- id: power_bi_service
  prompt: Power BI service
  answer: Power BI via Office 365. Cloud based, so strictly off-premise.
  tags:
  - power-bi
  - deployment
  - band-yellow
  tier: exam
- id: power_bi_mobile
  prompt: Power BI Mobile
  answer: Power BI on smartphones and tablets, one of the deployment options.
  tags:
  - power-bi
  - deployment
  - band-yellow
  tier: exam
- id: delimiter
  prompt: Delimiter
  answer: A separator such as a space, comma, or semicolon between elements in imported data.
  tags:
  - power-bi
  - etl
  - band-red
  tier: exam
- id: applied_steps
  prompt: Applied Steps
  answer: The Query Editor's list of every shaping step, in order. Power BI replays the list each time the data refreshes.
  tags:
  - support
  - power-bi
  - band-blue
  tier: support
- id: close_and_load
  prompt: Close & Load
  answer: The Query Editor command that finishes shaping and loads the data into the model.
  tags:
  - support
  - power-bi
  - band-blue
  tier: support
- id: star_schema
  prompt: Star schema
  answer: A star schema is a type of relational data structure optimized for analytics.
  tags:
  - modeling
  - band-green
  tier: exam
- id: fact_table
  prompt: Fact table
  answer: In a star schema, the central entity is called the Fact table.
  tags:
  - modeling
  - band-green
  tier: exam
- id: dimension_table
  prompt: Dimension table
  answer: In a star schema, the central entity is called the Fact table. All other tables are called Dimension tables and are directly connected to the Fact table.
  tags:
  - modeling
  - band-green
  tier: exam
- id: data_view
  prompt: Table view
  answer: The Power BI Desktop view that shows the rows of each table. The course recommends creating calculations here, from the Modeling tab.
  tags:
  - support
  - power-bi
  - band-green
  tier: support
- id: report_canvas
  prompt: Report canvas
  answer: The page in Power BI Desktop where visuals are built by dragging fields onto it.
  tags:
  - support
  - power-bi
  - band-green
  tier: support
- id: visual_details
  prompt: Visual details area
  answer: The course's name for the area under Visualizations where fields go into the axes, legend, values, and details of the selected visual.
  tags:
  - support
  - power-bi
  - band-green
  tier: support
- id: slicer
  prompt: Slicer
  answer: A visual on the report canvas that filters the other visuals on the page when you pick a value.
  tags:
  - support
  - power-bi
  - band-yellow
  tier: support
- id: filter_pane
  prompt: Filters pane
  answer: Filters a visual, page, or report the way a slicer does, but is not shown on the canvas.
  tags:
  - support
  - power-bi
  - band-green
  tier: support
- id: aggregation
  prompt: Aggregation
  answer: 'How Power BI combines a field''s values in a visual: sum by default, or average, count, minimum, or maximum.'
  tags:
  - support
  - power-bi
  - band-red
  tier: support
