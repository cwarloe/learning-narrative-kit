name: Validate units

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "tools/**"
      - "requirements-browser.txt"
      - "docs/**"
      - "requirements.txt"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "PyYAML>=6.0"

      - name: Validate every example unit
        run: |
          set -euo pipefail
          fail=0
          for d in examples/*/; do
            echo "::group::$(basename "$d")"
            if ! python tools/validate_unit.py "$d"; then
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more units failed validate_unit.py"
            exit 1
          fi
          echo "All example units passed."

      - name: Portland dates and canon identifiers
        run: python tools/check_dates.py

      - name: Episode 7 capture matches its drill
        run: python tools/check_ep07_capture.py

      - name: Flashcard decks render (no HTML-as-code trap, lnk-deck fences well formed)
        run: python tools/check_decks.py

      - name: Exam 2 study cards are up to date with cards.yaml
        run: |
          python examples/itm310-exam2-cards/build_cards.py
          git diff --exit-code -- examples/itm310-exam2-cards

  landing-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Landing page matches builder; hub links resolve
        run: python tools/check_hub_links.py

      - name: Every tools/ script is in the tools/README.md index (warning only)
        run: python tools/check_tools_index.py --warn

  browser-decks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser checks
        run: |
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Exercise flashcards and workbenches at desktop and phone widths
        env:
          BROWSER_ARTIFACTS: ${{ runner.temp }}/lnk-browser-failures
        run: python tools/check_decks_browser.py
      - name: Save failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flashcard-browser-failures
          path: ${{ runner.temp }}/lnk-browser-failures
          if-no-files-found: ignore
