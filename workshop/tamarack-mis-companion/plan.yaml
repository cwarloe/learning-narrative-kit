story:
  premise: 'Dana Okafor''s first year as Tamarack''s business systems analyst: eleven stores, a DC and
    a propane division running on systems nobody chose on purpose.'
  setting: Tamarack Feed & Supply Company, Spokane Valley and the stores (examples/TAMARACK.md), January–October
    2026
  cast: 'From canon: Dana (POV), Ruth, Walt, Teo, Marcy, Hank, Eli. Recurring minor characters used so
    far but not in the canon cast table: Curtis (Colville), Karen (seed supplier AR), Arlo Nygaard (Republic),
    Jim Sorensen.'
  through_line: Each fix Tamarack makes on purpose creates the next problem it didn't plan for. The inventory
    pilot needs reliable servers (ch02); the servers get exploited (ch05); the cleaned-up data feeds the
    decisions (ch08) and the AI (ch09); and by ch10 the question is no longer which system but where any
    of it should run, and what happens at Republic when the line goes down.
