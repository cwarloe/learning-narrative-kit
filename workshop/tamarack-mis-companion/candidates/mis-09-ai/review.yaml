deck_id: mis-09-ai
cards:
- id: artificial_intelligence_ai
  prompt: "Artificial intelligence (AI)"
  answer: "Artificial intelligence (AI) consists of related technologies that try to simulate and reproduce human thought and behavior, including thinking, speaking, feeling, and reasoning. AI technologies apply computers to areas that require knowledge, perception, reasoning, understanding, and cognitive abilities."
  tags:
  - mod-09
  tier: exam
- id: artificial_neural_networks_anns
  prompt: "Artificial neural networks (ANNs)"
  answer: "Artificial neural networks (ANNs) are networks that learn and are capable of performing tasks that are difficult with conventional computers, such as playing chess, recognizing patterns in faces and objects, and filtering spam e-mail."
  tags:
  - mod-09
  tier: exam
- id: augmented_intelligence
  prompt: "Augmented intelligence"
  answer: "The goal of augmented intelligence is to complement decision makers, not replace them."
  tags:
  - mod-09
  tier: exam
- id: backward_chaining
  prompt: "backward chaining"
  answer: "In backward chaining, the expert system starts with the goal—the “then” part—and backtracks to find the right solution."
  tags:
  - mod-09
  tier: exam
- id: case_based_reasoning_cbr
  prompt: "case-based reasoning (CBR)"
  answer: "Case-based reasoning (CBR) is a problem-solving technique that matches a new case (problem) with a previously solved case and its solution, the details of which have been stored in a database. After finding a match, the CBR system offers a solution; if no match is found, even after more information is supplied, the human expert must solve the problem."
  tags:
  - mod-09
  tier: exam
- id: expert_systems
  prompt: "Expert systems"
  answer: "Expert systems mimic human expertise in a particular field to solve a problem in a well-defined area."
  tags:
  - mod-09
  tier: exam
- id: explanation_facility
  prompt: "explanation facility"
  answer: "An explanation facility performs tasks similar to what a human expert does by explaining to end users how recommendations are derived."
  tags:
  - mod-09
  tier: exam
- id: forward_chaining
  prompt: "forward chaining"
  answer: "In forward chaining, a series of “if–then–else” condition pairs is performed."
  tags:
  - mod-09
  tier: exam
- id: fuzzy_logic
  prompt: "Fuzzy logic"
  answer: "Fuzzy logic allows a smooth, gradual transition between human and computer vocabularies and deals with variations in linguistic terms by using a degree of membership."
  tags:
  - mod-09
  tier: exam
- id: genetic_algorithms_gas
  prompt: "Genetic algorithms (GAs)"
  answer: "Genetic algorithms (GAs) are search algorithms that mimic the process of natural evolution. They are used to generate solutions to optimization and search problems using such techniques as mutation, selection, crossover, and chromosome."
  tags:
  - mod-09
  tier: exam
- id: inference_engine
  prompt: "inference engine"
  answer: "An inference engine is similar to the model base component of a decision support system. By using different techniques such as forward and backward chaining, it manipulates a series of rules."
  tags:
  - mod-09
  tier: exam
- id: intelligent_agents
  prompt: "Intelligent agents"
  answer: "Intelligent agents are software capable of reasoning and following rule-based processes; they are becoming more popular, especially in e-commerce."
  tags:
  - mod-09
  tier: exam
- id: knowledge_acquisition_facility
  prompt: "knowledge acquisition facility"
  answer: "A knowledge acquisition facility is a software package with manual or automated methods for acquiring and incorporating new rules and facts, making the expert system capable of growth."
  tags:
  - mod-09
  tier: exam
- id: knowledge_base
  prompt: "knowledge base"
  answer: "A knowledge base is similar to a database, but in addition to storing facts and figures, it keeps track of rules and explanations associated with facts."
  tags:
  - mod-09
  tier: exam
- id: knowledge_base_management_system_kbms
  prompt: "knowledge base management system (KBMS)"
  answer: "A knowledge base management system (KBMS), similar to a DBMS, is used to keep the knowledge base updated with changes to facts, figures, and rules."
  tags:
  - mod-09
  tier: exam
- id: machine_learning
  prompt: "Machine learning"
  answer: "Machine learning is a process and procedure by which knowledge is gained through experience. In other words, computers learn without being explicitly programmed."
  tags:
  - mod-09
  tier: exam
- id: monitoring_and_surveillance_agents
  prompt: "Monitoring and surveillance agents"
  answer: "Monitoring and surveillance agents usually track and report on computer equipment and network systems to predict when a system crash or failure might occur."
  tags:
  - mod-09
  tier: exam
- id: natural_language_processing_nlp
  prompt: "natural-language processing (NLP)"
  answer: "Natural-language processing (NLP) was developed so users could communicate with computers in human language."
  tags:
  - mod-09
  tier: exam
- id: personal_agents
  prompt: "Personal agents"
  answer: "Personal agents perform specific tasks for a user, such as remembering information for filling out Web forms or completing e-mail addresses after the first few characters are typed."
  tags:
  - mod-09
  tier: exam
- id: robots
  prompt: "Robots"
  answer: "Robots are one of the most successful applications of AI. They perform well at simple, repetitive tasks and can be used to free workers from tedious or hazardous jobs."
  tags:
  - mod-09
  tier: exam
- id: shopping_and_information_agents
  prompt: "Shopping and information agents"
  answer: "Shopping and information agents help users navigate through the vast resources available on the Web and provide better results in finding information. These agents can navigate the Web much faster than humans and gather more consistent, detailed information. They can serve as search engines, site reminders, or personal surfing assistants."
  tags:
  - mod-09
  tier: exam
- id: soft_robot
  prompt: "soft robot"
  answer: "A soft robot is made of elastomer, is simpler to make and less expensive than conventional robots, and is used for an increasing number of applications."
  tags:
  - mod-09
  tier: exam
