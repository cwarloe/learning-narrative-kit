bank_id: mis-05-security
title: Tamarack — The Invoice That Changed Its Bank — glossary
source: MindTap course glossary export (MIS), module '05. Protecting Information Resources'
terms:
- id: access_controls
  title: "Access controls"
  definition: "Access controls are designed to protect systems from unauthorized access in order to preserve data integrity."
  tags:
  - mod-05
  tier: exam
- id: adware
  title: "Adware"
  definition: "Adware is a form of spyware that collects information about the user (without the user’s consent) to determine which advertisements to display in the user’s Web browser."
  tags:
  - mod-05
  tier: exam
- id: asymmetric_encryption
  title: "Asymmetric encryption"
  definition: "Asymmetric encryption uses two keys: a public key known to everyone and a private or secret key known only to the recipient. A message encrypted with a public key can be decrypted only with the same algorithm used by the public key and requires the recipient’s private key, too. Any people who intercept the message cannot decrypt it because they do not have the private key."
  tags:
  - mod-05
  tier: exam
- id: authentication_tokens
  title: "Authentication tokens"
  definition: "Authentication tokens improve security by transmitting a security token among connected applications. The user logs in once with approved credentials, and then a unique token is generated and shared with connected applications or Web sites to verify the user’s identity for a given period."
  tags:
  - mod-05
  tier: exam
- id: availability
  title: "Availability"
  definition: "Availability means that computers and networks are operating, and that authorized users can access the information they need. It also means a quick recovery in the event of a system failure or disaster."
  tags:
  - mod-05
  tier: exam
- id: backdoor
  title: "backdoor"
  definition: "A backdoor (also called a trapdoor) is a programming routine built into a system by its designer or programmer. It enables the designer or programmer to bypass system security and sneak back into the system later to access programs or files."
  tags:
  - mod-05
  tier: exam
- id: baiting
  title: "Baiting"
  definition: "Baiting is similar to phishing attacks. What distinguishes it from phishing is the promise that the baiter gives to the recipient."
  tags:
  - mod-05
  tier: exam
- id: biometric_security_measures
  title: "Biometric security measures"
  definition: "Biometric security measures use a physiological element that is unique to a person and cannot be stolen, lost, copied, or passed on to others."
  tags:
  - mod-05
  tier: exam
- id: black_hats
  title: "Black hats"
  definition: "Hackers who specialize in unauthorized penetration of information systems. They attack systems for profit, fun, or political motivation or as part of a social cause. These penetration attacks often involve modifying and destroying data."
  tags:
  - mod-05
  tier: exam
- id: blended_threat
  title: "blended threat"
  definition: "A blended threat is a security threat that combines the characteristics of computer viruses, worms, and other malicious codes with vulnerabilities found on public and private networks."
  tags:
  - mod-05
  tier: exam
- id: brain_password
  title: "brain password"
  definition: "A brain password is a digital reading of a user’s brain activity while looking at a series of images. These brain activities are recorded in a database. To log in to a system or enter a secure room, the user puts on a special hat and again watches the sequence of images. The new brain activities are compared with the ones in the database and then access is given or denied."
  tags:
  - mod-05
  tier: exam
- id: business_continuity_planning
  title: "business continuity planning"
  definition: "Business continuity planning outlines procedures for keeping an organization operational after a natural disaster or network attack."
  tags:
  - mod-05
  tier: exam
- id: callback_modem
  title: "callback modem"
  definition: "A callback modem verifies whether a user’s access is valid by logging the user off (after the user attempts to connect to the network) and then calling the user back at a predetermined number."
  tags:
  - mod-05
  tier: exam
- id: computer_fraud
  title: "Computer fraud"
  definition: "Computer fraud is the unauthorized use of computer data for personal gain."
  tags:
  - mod-05
  tier: exam
- id: confidentiality
  title: "Confidentiality"
  definition: "Confidentiality means that a system must prevent disclosing information to anyone who is not authorized to access it."
  tags:
  - mod-05
  tier: exam
- id: cryptojacking
  title: "Cryptojacking"
  definition: "Cryptojacking occurs when hackers secretly use the computing power of a user to mine cryptocurrency."
  tags:
  - mod-05
  tier: exam
- id: denial_of_service_dos_attack
  title: "denial-of-service (DoS) attack"
  definition: "A denial-of-service (DoS) attack floods a network or server with service requests to prevent legitimate users’ access to the system."
  tags:
  - mod-05
  tier: exam
- id: dna_identification
  title: "DNA identification"
  definition: "DNA identification gathers a user’s unique behavioral characteristics and then creates an “eDNA” profile that is used for identification when the user tries to log in to a system."
  tags:
  - mod-05
  tier: exam
- id: fault_tolerant_systems
  title: "fault-tolerant systems"
  definition: "Fault-tolerant systems ensure availability in the event of a system failure by using a combination of hardware and software."
  tags:
  - mod-05
  tier: exam
- id: firewall
  title: "firewall"
  definition: "A firewall is a combination of hardware and software that acts as a filter or barrier between a private network and external computers or networks, including the Internet. A network administrator defines rules for access, and all other data transmissions are blocked."
  tags:
  - mod-05
  tier: exam
- id: gray_hats
  title: "Gray hats"
  definition: "As you might imagine, they are a mixture of black and white hacking. Gray hats may violate laws or ethical standards, but they do not have the malicious intent to harm a person or a system. They look for vulnerabilities in a system without the owner’s permission or knowledge. They may inform the owner that they have found vulnerabilities and will fix them for a small fee."
  tags:
  - mod-05
  tier: exam
- id: integrity
  title: "Integrity"
  definition: "Integrity refers to the accuracy of information resources within an organization."
  tags:
  - mod-05
  tier: exam
- id: intrusion_detection_system_ids
  title: "intrusion detection system (IDS)"
  definition: "An intrusion detection system (IDS) can protect against both external and internal access. It is usually placed in front of a firewall and can identify attack signatures, trace patterns, generate alarms for the network administrator, and cause routers to terminate connections with suspicious sources."
  tags:
  - mod-05
  tier: exam
- id: keystroke_loggers
  title: "Keystroke loggers"
  definition: "Keystroke loggers are software or hardware devices that monitor and record keystrokes."
  tags:
  - mod-05
  tier: exam
- id: logic_bomb
  title: "logic bomb"
  definition: "A logic bomb is a type of Trojan program used to release a virus, worm, or other destructive code. Logic bombs are triggered at a certain time (sometimes the birthday of a famous person) or by a specific event, such as a user pressing the Enter key or running a certain program."
  tags:
  - mod-05
  tier: exam
- id: macro_viruses
  title: "Macro viruses"
  definition: "A type of virus that uses a program’s own macro programming language to distribute the virus."
  tags:
  - mod-05
  tier: exam
- id: nonrepudiation
  title: "nonrepudiation"
  definition: "Nonrepudiation is a method for binding all parties to a contract."
  tags:
  - mod-05
  tier: exam
- id: password
  title: "password"
  definition: "A password is a combination of numbers, characters, and symbols that a user enters to gain access to a system."
  tags:
  - mod-05
  tier: exam
- id: pharming
  title: "Pharming"
  definition: "Similar to phishing, pharming directs Internet users to fraudulent Web sites with the intention of stealing their personal information, such as Social Security numbers, passwords, bank account numbers, and credit card numbers. The difference is that pharmers usually hijack an official Web site, then alter its IP address so that users who enter the correct Web address are directed to the pharmer’s fraudulent Web site."
  tags:
  - mod-05
  tier: exam
- id: phishing
  title: "Phishing"
  definition: "Phishing is the transmission of fraudulent e-mails that seem to come from legitimate sources, such as a bank or university."
  tags:
  - mod-05
  tier: exam
- id: physical_security_measures
  title: "Physical security measures"
  definition: "Physical security measures primarily control access to computers and networks, and they include devices for securing computers and peripherals from theft."
  tags:
  - mod-05
  tier: exam
- id: pki_public_key_infrastructure
  title: "PKI (public key infrastructure)"
  definition: "A PKI (public key infrastructure) enables users of a public network such as the Internet to securely and privately exchange data through the use of a pair of keys—a public one and a private one—that is obtained from a trusted authority and shared through that authority."
  tags:
  - mod-05
  tier: exam
- id: quid_pro_quo
  title: "quid pro quo"
  definition: "Similar to baiting, quid pro quo involves a hacker requesting the exchange of critical data or login information for a service or prize."
  tags:
  - mod-05
  tier: exam
- id: rootkit
  title: "rootkit"
  definition: "A rootkit is a series of software tools that enable an unauthorized user to gain access to a computer or network system without being detected."
  tags:
  - mod-05
  tier: exam
- id: script_kiddies
  title: "Script kiddies"
  definition: "Inexperienced, usually young hackers who use programs that others have developed to attack computer and network systems and deface Web sites."
  tags:
  - mod-05
  tier: exam
- id: secure_sockets_layer_ssl
  title: "Secure Sockets Layer (SSL)"
  definition: "Secure Sockets Layer (SSL) is a commonly used encryption protocol that manages transmission security on the Internet."
  tags:
  - mod-05
  tier: exam
- id: sniffing
  title: "Sniffing"
  definition: "Sniffing is capturing and recording network traffic."
  tags:
  - mod-05
  tier: exam
- id: social_engineering
  title: "social engineering"
  definition: "Social engineering takes advantage of the human element of a security system to trick others into revealing private information."
  tags:
  - mod-05
  tier: exam
- id: spoofing
  title: "Spoofing"
  definition: "Spoofing is an attempt to gain access to a network by posing as an authorized user in order to find sensitive information, such as passwords and credit card information."
  tags:
  - mod-05
  tier: exam
- id: spyware
  title: "Spyware"
  definition: "Spyware is software that secretly gathers information about users while they browse the Web."
  tags:
  - mod-05
  tier: exam
- id: symmetric_encryption
  title: "symmetric encryption"
  definition: "In symmetric encryption (also called secret key encryption), the same key is used to encrypt and decrypt the message. The sender and receiver must agree on the key and keep it secret."
  tags:
  - mod-05
  tier: exam
- id: transport_layer_security_tls
  title: "Transport Layer Security (TLS)"
  definition: "Transport Layer Security (TLS) is a cryptographic protocol that ensures data security and integrity over public networks, such as the Internet."
  tags:
  - mod-05
  tier: exam
- id: trojan_programs
  title: "Trojan programs"
  definition: "A Trojan program contains code intended to disrupt a computer, network, or Web site, and it is usually hidden inside a popular program. Users run the program, unaware that the malicious program is also running in the background."
  tags:
  - mod-05
  tier: exam
- id: virtual_private_network_vpn
  title: "virtual private network (VPN)"
  definition: "A virtual private network (VPN) provides a secure “tunnel” through the Internet for transmitting messages and data via a private network."
  tags:
  - mod-05
  tier: exam
- id: virus
  title: "virus"
  definition: "A virus consists of self-propagating program code that is triggered by a specified time or event. When the infected program or operating system is used, the virus attaches itself to other files, and the cycle continues."
  tags:
  - mod-05
  tier: exam
- id: white_hats
  title: "White hats"
  definition: "Also known as ethical hackers, these are computer security experts who specialize in penetration testing and other testing methods to ensure that a company’s information systems are secure."
  tags:
  - mod-05
  tier: exam
- id: worm
  title: "worm"
  definition: "A worm travels from computer to computer in a network, but it does not usually erase data. Unlike viruses, worms are independent programs that can spread themselves without having to be attached to a host program."
  tags:
  - mod-05
  tier: exam
- id: zero_login
  title: "Zero login"
  definition: "Zero login assumes that devices will be smart and secure enough to quickly recognize users by their unique features, such as their voice and their typing patterns."
  tags:
  - mod-05
  tier: exam
- id: zero_trust_security
  title: "Zero trust security"
  definition: "Zero trust security requires every person and every device that accesses a network to be secure, regardless of whether the access is within the organization or outside of it."
  tags:
  - mod-05
  tier: exam
