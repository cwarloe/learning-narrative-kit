bank_id: mis-10-emerging
title: Tamarack — The Closet Gets Too Hot — glossary
source: MindTap course glossary export (MIS), module '10. Emerging Trends, Technologies, and Applications'
terms:
- id: 3d_printing
  title: "3D printing"
  definition: "3D printing, or additive manufacturing is a process for making a physical object from a three-dimensional digital model. The process is accomplished through the application of many successive thin layers of material."
  tags:
  - mod-10
  tier: exam
- id: 4d_printing
  title: "4D printing"
  definition: "4D printing uses special materials and sophisticated designs that are “programmed” to prompt 3D printed objects to change their shape and structure by the influence of external factors."
  tags:
  - mod-10
  tier: exam
- id: application_service_providers_asps
  title: "application service providers (ASPs)"
  definition: "Application service providers (ASPs) provide access to software or services for a fee."
  tags:
  - mod-10
  tier: exam
- id: augmented_reality_ar
  title: "Augmented reality (AR)"
  definition: "Augmented reality (AR) is a branch of virtual reality that generates a virtual scene that is overlaid on the real object."
  tags:
  - mod-10
  tier: exam
- id: avatar
  title: "avatar"
  definition: "An avatar is a 2D or 3D graphical representation of a person in the virtual world; avatars are used in chat rooms and online games."
  tags:
  - mod-10
  tier: exam
- id: backup_as_a_service_baas
  title: "backup as a service (BaaS)"
  definition: "The backup as a service (BaaS) model provides offsite data storage for files, folders, or the entire contents of a hard drive."
  tags:
  - mod-10
  tier: exam
- id: blockchain
  title: "blockchain"
  definition: "A blockchain is a decentralized and distributed network that is used to record transactions across connected devices as blocks of data that cannot be altered after being recorded."
  tags:
  - mod-10
  tier: exam
- id: blockchain_as_a_service_baas
  title: "Blockchain as a service (BaaS)"
  definition: "Blockchain as a service (BaaS) is third-party cloud-based infrastructure that organizations can use to develop their own blockchain and smart contract applications."
  tags:
  - mod-10
  tier: exam
- id: cave_automatic_virtual_environment_cave
  title: "cave automatic virtual environment (CAVE)"
  definition: "A cave automatic virtual environment (CAVE) consists of a cube-shaped room in which the walls are rear-projection screens. A CAVE uses holographic devices that create, capture, and display images in true 3D form."
  tags:
  - mod-10
  tier: exam
- id: cloud_computing
  title: "Cloud computing"
  definition: "Cloud computing uses one platform to incorporate many technologies, including the SaaS model, Web 2.0, grid computing, and utility computing; hence, a variety of resources can be provided to users over the Internet. Business applications are accessed via a Web browser, and data is stored on the providers’ servers."
  tags:
  - mod-10
  tier: exam
- id: cloud_storage
  title: "Cloud storage"
  definition: "Used for online storage and backup, cloud storage involves multiple virtual servers that are usually hosted by third parties. Customers buy or lease storage space from third parties based on their current or future needs."
  tags:
  - mod-10
  tier: exam
- id: community_cloud
  title: "community cloud"
  definition: "With the community cloud, the cloud infrastructure is designed for exclusive use by a specific community of users from organizations that share common concerns."
  tags:
  - mod-10
  tier: exam
- id: contextual_computing
  title: "contextual computing"
  definition: "Contextual computing refers to a computing environment that is always present, can feel our surroundings, and—based on who we are, where we are, and whom we are with—offer recommendations."
  tags:
  - mod-10
  tier: exam
- id: cryptocurrency
  title: "Cryptocurrency"
  definition: "Cryptocurrency is digital money created from computer codes. It is monitored by a peer-to-peer Internet protocol."
  tags:
  - mod-10
  tier: exam
- id: data_as_a_service_daas
  title: "data as a service (DaaS)"
  definition: "The data as a service (DaaS) model delivers data storage, integration, processing, and analytics services over the cloud."
  tags:
  - mod-10
  tier: exam
- id: distributed_cloud_computing
  title: "Distributed cloud computing"
  definition: "Distributed cloud computing reduces latency and improves performance by distributing cloud services such as data sets, storage, and processing to different physical locations that are closer to the users."
  tags:
  - mod-10
  tier: exam
- id: edge_computing
  title: "Edge computing"
  definition: "Edge computing pushes processing and data to the near edge of the network, which enables timely collection, processing, and analysis of data."
  tags:
  - mod-10
  tier: exam
- id: egocentric_environment
  title: "egocentric environment"
  definition: "In an egocentric environment, the user is totally immersed in the VR world."
  tags:
  - mod-10
  tier: exam
- id: exocentric_environment
  title: "exocentric environment"
  definition: "In an exocentric environment, the user is given a “window view” of VR. Data is still rendered in 3D, but users can only view it on a screen. They cannot interact with objects, as in an egocentric environment."
  tags:
  - mod-10
  tier: exam
- id: fungible_tokens
  title: "Fungible tokens"
  definition: "Fungible tokens are representations of assets on a blockchain that are interchangeable."
  tags:
  - mod-10
  tier: exam
- id: grid_computing
  title: "grid computing"
  definition: "Grid computing involves combining the processing powers of various computers. With this configuration, users can make use of other computers’ resources to solve problems involving large-scale, complex calculations, such as circuit analysis or mechanical design—problems that a single computer is not capable of solving in a timely manner."
  tags:
  - mod-10
  tier: exam
- id: hybrid_cloud
  title: "hybrid cloud"
  definition: "A hybrid cloud is a collection of at least one private cloud and at least one public cloud. In a hybrid cloud environment, there are a variety of public and private options, with multiple providers."
  tags:
  - mod-10
  tier: exam
- id: implanted_microchips
  title: "Implanted microchips"
  definition: "Implanted microchips, a controversial technology, are microchips the size of a grain of rice that are inserted between the thumb and the index finger. The microchip can store various information, including that for a user’s ID cards and credit cards, which could be used to log in to Web sites and to enter a secure room."
  tags:
  - mod-10
  tier: exam
- id: infrastructure_as_a_service_iaas
  title: "Infrastructure as a service (IaaS)"
  definition: "Infrastructure as a service (IaaS), also called hardware as a service (HaaS), is a type of cloud computing whereby computer infrastructure (such as storage, hardware, servers, and networking components) is delivered as a service."
  tags:
  - mod-10
  tier: exam
- id: metaverse
  title: "metaverse"
  definition: "The metaverse is a 3D virtual world that provides a seamless digital environment where users can do almost everything they do in the real world, such as playing games, shopping, buying real estate, and attending conferences."
  tags:
  - mod-10
  tier: exam
- id: mixed_reality_mr
  title: "Mixed reality (MR)"
  definition: "Mixed reality (MR) overlays virtual objects on real objects and anchors virtual objects to real-world objects so they can interact with one another."
  tags:
  - mod-10
  tier: exam
- id: multicloud
  title: "Multicloud"
  definition: "Multicloud refers to using more than a single public cloud in an organization."
  tags:
  - mod-10
  tier: exam
- id: nanotechnology
  title: "Nanotechnology"
  definition: "Nanotechnology incorporates techniques that involve the structure and composition of materials on a nanoscale."
  tags:
  - mod-10
  tier: exam
- id: non_fungible_token_nft
  title: "non-fungible token (NFT)"
  definition: "A non-fungible token (NFT) is a one-of-a-kind crypto asset in which each token is unique and backed by a blockchain."
  tags:
  - mod-10
  tier: exam
- id: on_demand_software
  title: "on-demand software"
  definition: "Software that is distributed online for a monthly subscription or an annual fee."
  tags:
  - mod-10
  tier: exam
- id: platform_as_a_service_paas
  title: "Platform as a service (PaaS)"
  definition: "Platform as a service (PaaS) provides a computing platform and a computing solution as a service. Clients use the platform and environment to build applications and services over the Internet."
  tags:
  - mod-10
  tier: exam
- id: private_cloud
  title: "private cloud"
  definition: "In a private cloud, services and the infrastructure are run on a private network."
  tags:
  - mod-10
  tier: exam
- id: public_cloud
  title: "public cloud"
  definition: "With a public cloud, users connect with an off-site infrastructure over the Internet."
  tags:
  - mod-10
  tier: exam
- id: qr_quick_response_code
  title: "QR (quick response) code"
  definition: "A QR (quick response) code is a matrix barcode consisting of black modules arranged in a square pattern on a white background."
  tags:
  - mod-10
  tier: exam
- id: quantum_computing
  title: "Quantum computing"
  definition: "Quantum computing uses quantum mechanics to generate and manipulate quantum bits, or qubits. A quantum computer solves problems considered impossible for traditional computers."
  tags:
  - mod-10
  tier: exam
- id: security_as_a_service_secaas
  title: "security as a service (SECaaS)"
  definition: "The security as a service (SECaaS) model provides cybersecurity services on a subscription basis."
  tags:
  - mod-10
  tier: exam
- id: semi_fungible_tokens_sfts
  title: "Semi-fungible tokens (SFTs)"
  definition: "Semi-fungible tokens (SFTs) can be traded as both fungible and non-fungible."
  tags:
  - mod-10
  tier: exam
- id: software_as_a_service
  title: "Software as a Service"
  definition: "Software that is distributed online for a monthly subscription or an annual fee."
  tags:
  - mod-10
  tier: exam
- id: software_as_a_service_saas
  title: "Software as a service (SaaS)"
  definition: "Software as a service (SaaS), also known as on-demand software, is a model in which ASPs deliver software to users for a fee; the software is for temporary or long-term use."
  tags:
  - mod-10
  tier: exam
- id: utility_on_demand_computing
  title: "Utility (on-demand) computing"
  definition: "Utility (on-demand) computing is the provision of IT services on demand. Users pay for computing or storage resources on an as-needed basis, similar to the way one pays for utilities such as heat and water."
  tags:
  - mod-10
  tier: exam
- id: virtual_reality_vr
  title: "Virtual reality (VR)"
  definition: "Virtual reality (VR) uses computer-generated, three-dimensional images to create the illusion of interaction in a real-world environment."
  tags:
  - mod-10
  tier: exam
- id: virtual_world
  title: "virtual world"
  definition: "A virtual world is a simulated environment designed for users to interact with one another via avatars."
  tags:
  - mod-10
  tier: exam
