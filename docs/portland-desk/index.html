<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portland Desk (Book 0: Zero-to-One) — IT & Security Incident Courseware</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Portland Desk: An operational narrative courseware from Zero Knowledge to Tier 1 IT Support & Junior Security Analyst readiness across CompTIA A+, Network+, and Security+.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Core Docsify & Plugins CSS -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css">
  
  <!-- LNK Custom Theme & Components -->
  <link rel="stylesheet" href="assets/lnk-theme.css">
  <link rel="stylesheet" href="assets/lnk-terminal.css">
  <link rel="stylesheet" href="assets/lnk-panel.css">
</head>
<body>
  <div id="app">Loading Learning Narrative Kit...</div>

  <!-- LNK Floating Hover Tooltip -->
  <div id="lnk-tooltip" role="tooltip" aria-hidden="true">
    <div class="tt-tier" id="tt-tier">Vocabulary</div>
    <div class="tt-title" id="tt-title"></div>
    <div class="tt-body" id="tt-body"></div>
    <div class="tt-context" id="tt-context"></div>
  </div>

  <script>
    // 1. Preload Master Domain Glossary
    window.__GLOSSARY__ = {};
    fetch('assets/glossary.json')
      .then(function(res) { return res.json(); })
      .then(function(data) { window.__GLOSSARY__ = data; })
      .catch(function(err) { console.warn('Could not load assets/glossary.json', err); });

    // 2. Docsify Configuration
    window.$docsify = {
      name: 'Portland Desk (Book 0)',
      repo: 'https://github.com/cwarloe/learning-narrative-kit',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      notFoundPage: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search incidents, tickets & labs...',
        noData: 'No matching records found.',
        depth: 3
      },
      latex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$']],
        overflowScroll: true
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      mermaidConfig: {
        querySelector: ".mermaid"
      },
      plugins: [
        function(hook) {
          // Parse [[term_id|Surface Text]] and [[term_id]] into interactive LNK spans
          hook.beforeEach(function(content) {
            content = content.replace(/`?\[\[([a-zA-Z0-9_-]+)(?:\|([^\]]+))?\]\]`?/g, function(match, id, text) {
              const item = window.__GLOSSARY__[id];
              const displayText = text || (item && item.title ? item.title : id);
              const cat = (item && item.category) ? item.category : 'telemetry';
              return `<span class="term ${cat}" id="term-${id}" data-term="${id}">${displayText}</span>`;
            });

            // Parse ```bridge-card blocks into interactive HTML cards matching lnk-theme.css
            content = content.replace(/```bridge-card\s*([\s\S]*?)```/g, function(match, block) {
              const parts = block.split(/\n---\s*\n/);
              const header = parts[0] || '';
              const desc = (parts[1] || '').trim();
              
              function getField(key) {
                const m = header.match(new RegExp('^' + key + ':\\s*(.+)$', 'm'));
                return m ? m[1].trim() : '';
              }
              
              const title = getField('title');
              let target = getField('target');
              if (target.startsWith('../')) target = target.replace('../', '');
              if (!target.startsWith('/')) target = '/' + target;
              
              const domain = getField('domain');
              const badge = getField('badge') || 'Hands-On Lab';
              const cta = getField('cta') || 'Take the Ticket & Open the Lab \u2192';
              
              return `<div class="bridge-card">\n  <div class="bridge-label">${badge}${domain ? ' · ' + domain : ''}</div>\n  <div class="bridge-title">${title}</div>\n  <div class="bridge-desc">${desc}</div>\n  <a class="bridge-btn" href="#${target}">${cta}</a>\n</div>`;
            });

            // Parse ```callout-panel blocks into graphic novel schematic panels
            content = content.replace(/```callout-panel\s*([\s\S]*?)```/g, function(match, block) {
              function getVal(key) {
                const m = block.match(new RegExp('^' + key + ':\\s*(.+)$', 'm'));
                return m ? m[1].trim().replace(/^["']|["']$/g, '') : '';
              }
              const title = getVal('title') || 'TECHNICAL SCHEMATIC';
              const badge = getVal('badge') || 'Graphic Panel';
              const caption = getVal('caption') || '';
              const image = getVal('image') || '';
              const ratio = getVal('ratio') || '16-9';
              const prompt = getVal('prompt') || '';
              // alt is required whenever image is set (tools/check_panels.py fails the build without it).
              const alt = getVal('alt').replace(/"/g, '&quot;');
              const credit = getVal('credit');

              let visualHtml = '';
              if (image) {
                visualHtml = `<div class="panel-canvas ratio-${ratio}"><img class="panel-img" src="${image}" alt="${alt}" loading="lazy"></div>`;
              } else {
                visualHtml = `<div class="panel-placeholder">
                  <div class="panel-placeholder-icon">&#9638; [ GRAPHIC NOVEL SCHEMATIC PANEL ]</div>
                  <div style="font-size: 0.85rem; color: #94a3b8; font-weight: 600;">Concept Art Prompt Ready for Grok Imagine</div>
                  ${prompt ? `<div class="panel-placeholder-prompt"><strong>Prompt:</strong> ${prompt}</div>` : ''}
                </div>`;
              }

              return `<div class="panel-container">\n  <div class="panel-header">\n    <span class="panel-title">${title}</span>\n    <span class="panel-badge">${badge}</span>\n  </div>\n  ${visualHtml}\n  ${caption ? `<div class="panel-footer">${caption}</div>` : ''}
  ${credit ? `<div class="panel-credit">${credit}</div>` : ''}\n</div>`;
            });

            // Parse ```lnk-terminal blocks into interactive micro-terminals
            content = content.replace(/```lnk-terminal\s*([\s\S]*?)```/g, function(match, block) {
              const parts = block.split(/\n---\s*\n/);
              const header = parts[0] || '';
              const body = parts[1] || '';

              function getVal(key) {
                const m = header.match(new RegExp('^' + key + ':\\s*(.+)$', 'm'));
                return m ? m[1].trim().replace(/^["']|["']$/g, '') : '';
              }

              const title = getVal('title') || 'INTERACTIVE DIAGNOSTIC TERMINAL';
              const prompt = getVal('prompt') || 'C:\\> ';
              const shell = getVal('shell') || 'cmd';
              const replay = getVal('replay') !== 'false';

              // Parse objectives
              const objectives = [];
              const objMatches = header.matchAll(/-\s*id:\s*([^\n]+)\s*\n\s*label:\s*["']?([^"'\n]+)["']?\s*\n\s*trigger:\s*["']?([^"'\n]+)["']?/g);
              for (const m of objMatches) {
                objectives.push({ id: m[1].trim(), label: m[2].trim(), trigger: m[3].trim() });
              }

              // Parse commands from body
              const commands = {};
              const cmdBlocks = body.split(/\n(?=[a-zA-Z0-9_\-./ ]+:\s*\|)/);
              cmdBlocks.forEach(function(b) {
                const m = b.match(/^([a-zA-Z0-9_\-./ ]+):\s*\|\s*\n([\s\S]*)$/);
                if (m) {
                  const cmdKey = m[1].trim();
                  const cmdOut = m[2].replace(/^[ ]{2}/gm, '').trimEnd();
                  commands[cmdKey] = cmdOut;
                }
              });

              const configStr = encodeURIComponent(JSON.stringify({ title, prompt, shell, objectives }));
              const cmdStr = encodeURIComponent(JSON.stringify(commands));

              let objPills = '';
              if (objectives.length > 0) {
                objPills = '<div class="lnk-term-objectives">' + objectives.map(function(o) {
                  return `<div class="lnk-term-obj-pill" data-obj="${o.id}"><span class="lnk-term-obj-check">&#9675;</span> <span>${o.label}</span></div>`;
                }).join('') + '</div>';
              }

              return `<div class="lnk-term-window lnk-terminal-instance" data-config="${configStr}" data-commands="${cmdStr}">\n  <div class="lnk-term-bar">\n    <div class="lnk-term-dots">\n      <span class="lnk-term-dot red"></span>\n      <span class="lnk-term-dot yellow"></span>\n      <span class="lnk-term-dot green"></span>\n    </div>\n    <div class="lnk-term-title">${title}</div>\n    <div class="lnk-term-actions">\n      ${replay ? '<button type="button" class="lnk-term-btn lnk-term-replay-btn">Replay Triage</button>' : ''}\n    </div>\n  </div>\n  <div class="lnk-term-screen">\n    <div class="lnk-term-line"><span style="color:#64748b;">// Type diagnostic commands or click 'Replay Triage'. Type 'help' for available commands.</span></div>\n    <div class="lnk-term-input-row">\n      <span class="lnk-term-prompt">${prompt}</span>\n      <input type="text" class="lnk-term-input" spellcheck="false" autocomplete="off" placeholder="...">\n    </div>\n  </div>\n  ${objPills}\n</div>`;
            });

            return content;
          });

          // Bind Hover Tooltip & Tap Popovers
          hook.doneEach(function() {
            // Apply category classes dynamically once glossary data arrives
            document.querySelectorAll('.term').forEach(function(el) {
              const id = el.getAttribute('data-term');
              const item = window.__GLOSSARY__[id];
              if (item && item.category) el.classList.add(item.category);
            });

            const tooltip = document.getElementById('lnk-tooltip');
            const ttTier = document.getElementById('tt-tier');
            const ttTitle = document.getElementById('tt-title');
            const ttBody = document.getElementById('tt-body');
            const ttContext = document.getElementById('tt-context');

            function placeTooltip(e) {
              const pad = 14;
              let x = (e.pageX || (e.touches && e.touches[0] ? e.touches[0].pageX : 0)) + pad;
              let y = (e.pageY || (e.touches && e.touches[0] ? e.touches[0].pageY : 0)) + pad;
              tooltip.style.left = x + 'px';
              tooltip.style.top = y + 'px';
              const rect = tooltip.getBoundingClientRect();
              if (rect.right > window.innerWidth - 8) {
                x = (e.pageX || 0) - rect.width - pad;
                tooltip.style.left = Math.max(8, x) + 'px';
              }
              if (rect.bottom > window.innerHeight - 8) {
                y = (e.pageY || 0) - rect.height - pad;
                tooltip.style.top = Math.max(window.scrollY + 8, y) + 'px';
              }
            }

            function showTooltip(el, e) {
              const id = el.getAttribute('data-term');
              const item = window.__GLOSSARY__[id];
              if (!item) return;

              ttTier.textContent = (item.category || 'Vocabulary').toUpperCase();
              ttTier.className = 'tt-tier ' + (item.category || '');
              ttTitle.textContent = item.title || id;
              ttBody.textContent = item.definition || '';
              if (item.context) {
                ttContext.textContent = item.context;
                ttContext.style.display = 'block';
              } else {
                ttContext.textContent = '';
                ttContext.style.display = 'none';
              }
              tooltip.style.display = 'block';
              tooltip.setAttribute('aria-hidden', 'false');
              placeTooltip(e);
            }

            function hideTooltip() {
              tooltip.style.display = 'none';
              tooltip.setAttribute('aria-hidden', 'true');
            }

            // Desktop Hover & Mobile Tap Handlers
            let activeTouchTerm = null;
            document.querySelectorAll('.term').forEach(function(el) {
              el.addEventListener('mouseenter', function(e) { showTooltip(el, e); });
              el.addEventListener('mousemove', function(e) {
                if (tooltip.style.display === 'block') placeTooltip(e);
              });
              el.addEventListener('mouseleave', hideTooltip);

              el.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                  if (activeTouchTerm === el && tooltip.style.display === 'block') {
                    hideTooltip();
                    activeTouchTerm = null;
                  } else {
                    activeTouchTerm = el;
                    showTooltip(el, e);
                  }
                }
              });
            });

            document.addEventListener('click', function(e) {
              if (!e.target.closest('.term') && !e.target.closest('#lnk-tooltip')) {
                hideTooltip();
                activeTouchTerm = null;
              }
            });

            // Smooth scroll and pulse on term anchors
            document.querySelectorAll('a[href*="#term-"]').forEach(function(link) {
              link.addEventListener('click', function(e) {
                const href = link.getAttribute('href');
                const hashIndex = href.indexOf('#');
                if (hashIndex === -1) return;
                const targetId = href.substring(hashIndex + 1);
                const targetEl = document.getElementById(targetId) || document.querySelector(`.term[data-term="${targetId.replace('term-', '')}"]`);
                if (targetEl) {
                  e.preventDefault();
                  targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                  targetEl.classList.remove('flash', 'story-highlight');
                  void targetEl.offsetWidth;
                  targetEl.classList.add('flash');
                  setTimeout(function() { targetEl.classList.remove('flash'); }, 1400);
                }
              });
            });

            // Initialize interactive micro-terminals
            if (window.initLnkTerminals) {
              window.initLnkTerminals();
            }
          });
        }
      ]
    };
  </script>

  <!-- Docsify v4 Core Engine -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Mermaid Diagram Engine -->
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        darkMode: true,
        background: '#0f172a',
        primaryColor: '#1e293b',
        primaryTextColor: '#f8fafc',
        primaryBorderColor: '#38bdf8',
        lineColor: '#38bdf8',
        secondaryColor: '#334155',
        tertiaryColor: '#1e293b'
      }
    });
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>

  <!-- KaTeX Core Library & Docsify LaTeX Plugin -->
  <script src="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-latex@0"></script>

  <!-- Search & Clipboard Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <!-- Prism Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-http.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>

  <!-- LNK Interactive Micro-Terminal Engine -->
  <script src="assets/lnk-terminal.js"></script>

  <!-- LNK Custom Shell (Dual-Track Mode Switcher & Docked Aside) -->
  <script src="assets/lnk-shell.js"></script>
</body>
</html>
