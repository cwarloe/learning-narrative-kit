# Portland Desk knowledge ledger: when Ethan picks up each term, and where it came from.
# Contract: docs/research/KNOWLEDGE_LEDGER_STANDARD.md. Check: python3 tools/check_knowledge.py
#
# Episode 3 entries were read off the shipped text; default_gateway was confirmed by
# Charles on 2026-11-18. Every other entry was set by Claude on 2026-11-18, under
# Charles's go-ahead to use judgment for plausible career progress: A+ through Ep 02,
# Network+ from the IT rotation, Security+ from Ep 05 after he passes Network+.
# Change any entry you disagree with; the check reruns in seconds.

