deck_id: secplus-auth-helpdesk
cards:
  - id: authentication
    prompt: Authentication
    answer: "Proving a claimed identity is genuine — typically with something you know, have, or are."
    tags: [aaa, identity]
    tier: exam
  - id: authorization
    prompt: Authorization
    answer: "Deciding what an authenticated identity is allowed to do (permissions, roles, resources)."
    tags: [aaa, access]
    tier: exam
  - id: accounting
    prompt: Accounting
    answer: "Recording what an authenticated identity did — logs, sessions, and audit trails (the third A in AAA)."
    tags: [aaa]
    tier: exam
  - id: identification
    prompt: Identification
    answer: "Claiming an identity (username, badge ID, email) before authentication proves it."
    tags: [identity]
    tier: exam
  - id: something_you_know
    prompt: Something you know
    answer: "Knowledge factor — password, PIN, passphrase, or security question answer."
    tags: [factors]
    tier: exam
  - id: something_you_have
    prompt: Something you have
    answer: "Possession factor — phone authenticator, hardware token, security key, or smart card."
    tags: [factors]
    tier: exam
  - id: something_you_are
    prompt: Something you are
    answer: "Inherence factor — biometrics such as fingerprint, face, or iris."
    tags: [factors]
    tier: exam
  - id: somewhere_you_are
    prompt: Somewhere you are
    answer: "Location / context attribute — geo, network segment, or trusted site used as an additional signal."
    tags: [factors]
    tier: exam
  - id: single_factor
    prompt: Single-factor authentication
    answer: "Using only one authentication factor type. Password plus PIN is still single-factor — both are something you know."
    tags: [factors, mfa]
    tier: exam
  - id: mfa
    prompt: Multifactor authentication (MFA)
    answer: "Requiring two or more different factor types (know / have / are) before access is granted."
    tags: [mfa]
    tier: exam
  - id: password
    prompt: Password
    answer: "A secret string used as a knowledge factor for authentication."
    tags: [password]
    tier: exam
  - id: pin
    prompt: PIN
    answer: "Personal identification number — a short numeric knowledge factor, not a second factor type when paired with a password."
    tags: [password, factors]
    tier: exam
  - id: passphrase
    prompt: Passphrase
    answer: "A longer memorable phrase used as a password; length often beats dense complexity rules."
    tags: [password]
    tier: exam
  - id: password_length
    prompt: Password length
    answer: "How many characters a password has; modern guidance prioritizes sufficient length over ornate complexity alone."
    tags: [password, policy]
    tier: exam
  - id: password_complexity
    prompt: Password complexity
    answer: "Rules requiring mixed character classes (upper, lower, digit, symbol). Helpful, but length and uniqueness matter more."
    tags: [password, policy]
    tier: exam
  - id: password_reuse
    prompt: Password reuse
    answer: "Using the same password across systems or recycling recent passwords — spreads breach impact."
    tags: [password, policy]
    tier: exam
  - id: password_expiration
    prompt: Password expiration
    answer: "Forcing periodic password changes on a schedule. Modern guidance often prefers change-on-compromise over short expiry cycles."
    tags: [password, policy]
    tier: exam
  - id: password_age
    prompt: Password age
    answer: "How long the current password has been in use; tracked so policy can enforce maximum age or detect stale secrets."
    tags: [password, policy]
    tier: exam
  - id: password_manager
    prompt: Password manager
    answer: "Tool that stores unique strong passwords (and often autofills them) so users need not reuse secrets."
    tags: [password]
    tier: exam
  - id: passwordless
    prompt: Passwordless
    answer: "Authentication that replaces passwords with possession and/or biometrics (e.g. security keys, passkeys, device unlock)."
    tags: [auth-methods]
    tier: exam
  - id: soft_token
    prompt: Soft token
    answer: "Software-based possession factor — typically an authenticator app generating one-time codes."
    tags: [mfa, tokens]
    tier: exam
  - id: hard_token
    prompt: Hard token
    answer: "Hardware possession factor — a dedicated device that generates or stores one-time codes or cryptographic keys."
    tags: [mfa, tokens]
    tier: exam
  - id: security_key
    prompt: Security key
    answer: "Hardware authenticator (often USB/NFC) that proves possession via cryptography — phishing-resistant when used as a second factor or passwordless."
    tags: [mfa, tokens]
    tier: exam
  - id: totp
    prompt: TOTP
    answer: "Time-based one-time password — short codes from a shared secret that rotate on a clock (common in authenticator apps)."
    tags: [mfa, otp]
    tier: exam
  - id: sms_otp
    prompt: SMS OTP
    answer: "One-time code delivered by text message. Better than password alone, but weaker than app or hardware factors (SIM swap, interception)."
    tags: [mfa, otp]
    tier: exam
  - id: push_notification
    prompt: Push notification (MFA)
    answer: "Approve/deny prompt sent to a registered device as a possession check."
    tags: [mfa]
    tier: exam
  - id: biometrics
    prompt: Biometrics
    answer: "Something-you-are authentication using measurable physical traits (fingerprint, face, etc.)."
    tags: [factors, biometrics]
    tier: exam
  - id: sso
    prompt: Single sign-on (SSO)
    answer: "Authenticate once to an identity provider, then access multiple apps without separate logins for each."
    tags: [federation]
    tier: exam
  - id: federation
    prompt: Federation
    answer: "Trust relationship that lets one organization's identity provider assert identity to another system's service provider."
    tags: [federation]
    tier: exam
  - id: saml
    prompt: SAML
    answer: "Security Assertion Markup Language — common enterprise SSO protocol exchanging XML assertions between IdP and service."
    tags: [federation]
    tier: exam
  - id: oauth
    prompt: OAuth
    answer: "Authorization framework often used so apps get limited access tokens without sharing the user's password (desk tickets may say 'OAuth SSO' loosely)."
    tags: [federation]
    tier: exam
  - id: least_privilege
    prompt: Least privilege
    answer: "Grant only the access needed for the job — nothing extra 'just in case.'"
    tags: [access]
    tier: exam
  - id: rbac
    prompt: Role-based access control (RBAC)
    answer: "Assign permissions to roles (job functions), then assign users to roles — instead of one-off rights per person."
    tags: [access]
    tier: exam
  - id: account_lockout
    prompt: Account lockout
    answer: "Temporarily disabling an account after too many failed authentication attempts to slow password guessing."
    tags: [account, policy]
    tier: exam
  - id: provisioning
    prompt: Provisioning
    answer: "Creating accounts and assigning access when someone joins or changes roles."
    tags: [lifecycle]
    tier: exam
  - id: deprovisioning
    prompt: Deprovisioning
    answer: "Removing or disabling accounts and access when someone leaves or no longer needs them."
    tags: [lifecycle]
    tier: exam
  - id: privileged_access
    prompt: Privileged access
    answer: "Elevated rights (admin, root, domain) that can change systems or read sensitive data — tightly controlled."
    tags: [privilege]
    tier: exam
  - id: pam
    prompt: Privileged access management (PAM)
    answer: "Controls for privileged accounts — vaulting shared secrets, just-in-time elevation, and session oversight."
    tags: [privilege]
    tier: exam
  - id: help_desk
    prompt: Help desk
    answer: "Front-line IT support that takes tickets, resets access, and escalates when policy or systems need a deeper fix."
    tags: [support, desk]
    tier: support
  - id: ticket
    prompt: Ticket
    answer: "Tracked support request — the work unit the desk opens, updates, and closes."
    tags: [support, desk]
    tier: support
  - id: identity_provider
    prompt: Identity provider (IdP)
    answer: "System that authenticates users and issues assertions/tokens other apps trust (the 'sign in with company' brain)."
    tags: [support, federation]
    tier: support
  - id: authenticator_app
    prompt: Authenticator app
    answer: "Phone or desktop app that holds soft-token secrets and shows rotating TOTP codes (or push prompts)."
    tags: [support, mfa]
    tier: support
  - id: backup_codes
    prompt: Backup codes
    answer: "One-time recovery codes issued at MFA enrollment for when the phone or token is unavailable."
    tags: [support, mfa]
    tier: support
  - id: mfa_fatigue
    prompt: MFA fatigue
    answer: "Attack or habit where a user is spammed with push prompts until they approve one without thinking."
    tags: [support, mfa, security]
    tier: support
  - id: shoulder_surfing
    prompt: Shoulder surfing
    answer: "Watching someone enter credentials or codes in person — desks, cafés, transit."
    tags: [support, security]
    tier: support
  - id: shared_admin_account
    prompt: Shared admin account
    answer: "One privileged login used by multiple people — breaks accountability and complicates offboarding."
    tags: [support, privilege]
    tier: support
  - id: break_glass
    prompt: Break-glass account
    answer: "Emergency privileged account for outages when normal MFA/IdP paths fail — tightly vaulted and audited."
    tags: [support, privilege]
    tier: support
  - id: just_in_time
    prompt: Just-in-time (JIT) access
    answer: "Temporary elevation granted only when needed, then revoked — instead of standing admin rights."
    tags: [support, privilege]
    tier: support
  - id: vaulting
    prompt: Credential vaulting
    answer: "Storing privileged passwords in a controlled vault with checkout, rotation, and audit — not a shared spreadsheet."
    tags: [support, privilege]
    tier: support
  - id: offboarding
    prompt: Offboarding
    answer: "HR/IT process when someone leaves — disable accounts, reclaim devices, and strip residual access."
    tags: [support, lifecycle]
    tier: support
