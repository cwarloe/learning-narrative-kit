deck_id: secplus-ir-helpdesk
cards:
- id: event
  prompt: Event
  answer: An observable occurrence in a system or network — a login, alert, crash, or odd ticket — that
    may or may not be a security problem.
  tags:
  - ir
  tier: exam
- id: security_incident
  prompt: Security incident
  answer: A violation or imminent threat of violation of security policy, acceptable use, or standard
    security practices — not every scary ticket qualifies.
  tags:
  - ir
  tier: exam
- id: escalation
  prompt: Escalation
  answer: Handing an issue to a higher or more specialized team when criteria are met — with clean facts,
    not a Slack panic dump.
  tags:
  - ir
  tier: exam
- id: first_responder
  prompt: First responder
  answer: First person or team to touch an incident — at many orgs the help desk is that first touch and
    must preserve options for IR.
  tags:
  - ir
  tier: exam
- id: csirt
  prompt: CSIRT / IR team
  answer: Computer Security Incident Response Team (or equivalent IR team) — specialists who own analysis,
    forensics coordination, and incident command after escalation.
  tags:
  - ir
  tier: exam
- id: chain_of_custody
  prompt: Chain of custody
  answer: Documented control of evidence — who had it, when, and what changed — so findings stay credible
    and you do not casually wipe a laptop IR still needs.
  tags:
  - ir
  - evidence
  tier: exam
- id: ioc
  prompt: Indicator of compromise (IoC)
  answer: Observable clue that compromise may have happened — odd domains, hashes, filenames, login patterns
    — that desk can document and escalate.
  tags:
  - ir
  - detection
  tier: exam
- id: quarantine
  prompt: Quarantine
  answer: Isolating a file, email, or host into a restricted state so it cannot harm others while it is
    inspected or held.
  tags:
  - ir
  - containment
  tier: exam
- id: isolation
  prompt: Isolation
  answer: Separating a system from the network or peers to stop spread — pull the cable, disable Wi-Fi,
    or VLAN-park the host.
  tags:
  - ir
  - containment
  tier: exam
- id: need_to_know
  prompt: Need-to-know
  answer: Principle of sharing incident details only with people who require them to act — not blasting
    the whole company Slack.
  tags:
  - ir
  tier: exam
- id: ticket
  prompt: Ticket
  answer: Tracked support request — the work unit the desk opens, updates, and closes; not automatically
    an incident.
  tags:
  - support
  - desk
  tier: support
