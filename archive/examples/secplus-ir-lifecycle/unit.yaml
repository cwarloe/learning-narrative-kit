unit_id: secplus-ir-lifecycle
title: "Portland Desk — The Order You Do It In"
audience: "Someone studying Security+ incident response, or a NADF precursor for Ethan's help-desk years"
purpose: "Teach the SY0-701 incident response lifecycle through the cost of doing it out of order — contain before you eradicate, image before you clean, recover under watch — plus the plan/playbook/runbook apparatus that decides who decides. Companion to secplus-ir-helpdesk, which covers the first-touch decision before the lifecycle starts."
estimated_minutes: 18
sources:
  - CompTIA Security+ SY0-701 (incident response process; preparation; detection and analysis; containment, eradication, recovery; lessons learned)
  - CompTIA Security+ SY0-701 (digital forensics — acquisition, preservation, legal hold)
  - Common SY0-701 IR study clusters that surface as help-desk tickets and escalations
glossary: glossary.yaml
narrative: narrative.md
review: review.yaml
mark_convention: "[[term_id|surface text]]"
glossary_tiers:
  exam: "Security+ study targets — the primary study deck"
  support: "Desk/ops jargon marked so a non-IT reader can hover for readability"
review_filters:
  - "Exam-only: cards with tier: exam"
  - "All: exam + support cards (renderer may filter by tier)"
tooltip_contract:
  body: [definition, context]
  exclude_from_hover: [refs, sources, related]
  definition_style: "short 1–2 sentences; exam-faithful for tier exam, plain gloss for tier support"
  context_style: "optional one clause when bare definition would not land mid-scene"
constraints:
  - Every glossary term appears at least once in a ticket or decision
  - Story must pass the cover test (readable with marks hidden)
  - Teach the phases through the cost of breaking their order; never recite them as a list
  - Definitions stay exam-faithful; do not invent tooling behaviour or vendor specifics
  - Precursor tone: help desk as first touch, not CSIRT engineer narrative
  - Past tense narration, first person (see examples/PORTLAND_DESK.md); no foreshadowing of places or events the reader has not met
  - Narrator may feel lost; reader must never be confused by unexplained references
  - Two-tier glossary — tier exam for SY0-701 targets; tier support for desk jargon
  - Do not mark Portlandia/flavor background (pannier, MAX, bike helmet, rain pants, coffee, cubes-as-furniture vibe); leave flavor unmarked on purpose
  - No Priya or Harrowmere (Portland Desk rule)
  - Nothing closes cleanly — the permanent fix is blocked by the freeze, the inconvenienced user stays inconvenienced, and lessons learned is scheduled rather than done
sticky_decisions:
  - Containment comes before eradication; cleaning a box while the account is still live fixes nothing
  - Image before you clean — a reimage destroys the only copy that can answer a later question
  - A playbook that does not fit is an escalation, not an invitation to improvise
  - Severity comes from criteria, not from adrenaline
  - Lessons learned only counts if the playbook is different afterward
